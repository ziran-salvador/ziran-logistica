function fbErr(e){console.error(e);if(e&&e.code==='permission-denied')toast('Sem permissão para acessar estes dados. Confira se o usuário está ativo e se as regras do Firestore foram publicadas.');else toast('Erro de conexão com o banco: '+(e&&e.message||e));}
function setSync(t){const el=$('#sync');if(el)el.textContent=t||(navigator.onLine?'Sincronizado':'Sem internet: alterações serão enviadas quando voltar');}
window.addEventListener('online',()=>setSync());window.addEventListener('offline',()=>setSync());
function save(){
  if(!db||!ME||ME.status!=='ativo')return;
  const ops=[],who=USER.email,at=iso(now());
  COLS.forEach(col=>{const cur=new Map();(S[col]||[]).forEach(o=>{if(!o._k)o._k=rid();const j=strip(o);cur.set(o._k,j);if(!known[col]||known[col].get(o._k)!==j)ops.push({t:'set',col,k:o._k,d:Object.assign(clean(o),{_by:who,_at:at})});});
    if(known[col])known[col].forEach((j,k)=>{if(!cur.has(k))ops.push({t:'del',col,k});});known[col]=cur;});
  ['cad','seq'].forEach(m=>{const j=JSON.stringify(S[m]);if(knownMeta[m]!==j){knownMeta[m]=j;ops.push({t:'set',col:'meta',k:m,d:clean(S[m])});}});
  if(!ops.length)return;
  setSync('Salvando…');
  const chunks=[];for(let i=0;i<ops.length;i+=400)chunks.push(ops.slice(i,i+400));
  Promise.all(chunks.map(ch=>{const b=db.batch();ch.forEach(o=>{const ref=db.collection(o.col).doc(o.k);o.t==='del'?b.delete(ref):b.set(ref,o.d);});return b.commit();}))
    .then(()=>setSync()).catch(err=>{console.error(err);setSync('Erro ao salvar');toast('Não foi possível salvar: '+(err.code==='permission-denied'?'seu perfil não tem permissão para esta ação':err.message));});
}
let srT;function softRender(){clearTimeout(srT);srT=setTimeout(()=>{if(!inApp)return;const ae=document.activeElement;if(ae&&ae.closest&&ae.closest('#view')&&ae.matches('input,select,textarea')){softRender();return;}render();if(drawerFn)paintDrawer();},250);}
function stopListen(){unsub.forEach(u=>{try{u();}catch(e){}});unsub=[];loadedSet=new Set();}
function loaded(k){const first=loadedSet.size<8;loadedSet.add(k);if(loadedSet.size>=8&&first){const h0=(location.hash||'').slice(1);go(VIEWS.find(v=>v.id===h0&&allowed(v))?h0:'painel');}else if(loadedSet.size>=8)softRender();}
function listen(){
  stopListen();
  COLS.forEach(col=>{let q=db.collection(col);if(col==='log')q=q.orderBy('ts','desc').limit(800);
    unsub.push(q.onSnapshot(qs=>{const old=new Map((S[col]||[]).map(o=>[o._k,o]));const arr=[],kn=new Map();
      qs.forEach(d=>{const data=d.data();data._k=d.id;let o=old.get(d.id);if(o){Object.keys(o).forEach(k=>{if(!(k in data))delete o[k];});Object.assign(o,data);}else o=data;arr.push(o);kn.set(d.id,strip(o));});
      S[col]=arr;known[col]=kn;loaded(col);},fbErr));});
  ['cad','seq'].forEach(m=>unsub.push(db.collection('meta').doc(m).onSnapshot(s=>{if(s.exists){const d=s.data();S[m]=m==='cad'?Object.assign(EMPTY().cad,d):Object.assign(EMPTY().seq,d);}knownMeta[m]=JSON.stringify(S[m]);loaded('meta_'+m);},fbErr)));
  if(ME.perfil==='admin')unsub.push(db.collection('users').onSnapshot(qs=>{usersList=qs.docs.map(d=>Object.assign({uid:d.id},d.data()));if(cur==='usuarios')softRender();},fbErr));
}
/* perfis */
const ROLES={importar:['admin','supervisor'],cadastros:['admin','supervisor'],usuarios:['admin']};
const allowed=v=>{const r=ROLES[v.id||v];return !r||(ME&&r.includes(ME.perfil));};
/* telas de acesso */
const AUTH=$('#auth');
const AERR={'auth/invalid-credential':'E-mail ou senha incorretos.','auth/wrong-password':'E-mail ou senha incorretos.','auth/user-not-found':'E-mail ou senha incorretos.','auth/invalid-login-credentials':'E-mail ou senha incorretos.','auth/email-already-in-use':'Já existe uma conta com este e-mail. Use “Entrar” ou “Esqueci a senha”.','auth/weak-password':'A senha precisa ter pelo menos 6 caracteres.','auth/invalid-email':'E-mail inválido.','auth/too-many-requests':'Muitas tentativas. Aguarde alguns minutos e tente de novo.','auth/network-request-failed':'Sem conexão com a internet.','auth/operation-not-allowed':'Login por e-mail e senha não está ativado no Firebase (veja o passo a passo).','auth/unauthorized-domain':'Este endereço não está autorizado no Firebase (Authentication › Configurações › Domínios autorizados).'};
const aerr=e=>AERR[e&&e.code]||('Erro: '+(e&&e.message||e));
function showAuth(mode,msg){
  inApp=false;document.body.classList.add('locked');AUTH.hidden=false;
  const logo=$('.brand img').getAttribute('src');
  const card=inner=>`<div class="acard"><img src="${logo}" alt="Ziran" class="alogo"><div class="asub">Sistema de logística</div>${inner}</div>`;
  const m=msg?`<div class="amsg ${/sucesso|enviado|criada/i.test(msg)?'ok':''}">${H(msg)}</div>`:'';
  let h='';
  if(mode==='config')h=card(`<h2>Falta configurar o Firebase</h2><p>Abra o arquivo <b>firebase-config.js</b> no GitHub e cole os dados do seu projeto Firebase (passo 4 do guia).</p>`);
  else if(mode==='loading')h=card(`<p class="muted">Conectando…</p>`);
  else if(mode==='login')h=card(`<h2>Entrar</h2>${m}<form id="fLogin" class="aform"><label>E-mail<input type="email" id="aEmail" autocomplete="username" required></label><label>Senha<input type="password" id="aPass" autocomplete="current-password" required></label><button class="btn pri" type="submit">Entrar</button></form>
    <div class="alinks"><button type="button" class="lnk" data-amode="cadastro">Criar conta</button><button type="button" class="lnk" data-amode="esqueci">Esqueci a senha</button></div>`);
  else if(mode==='cadastro')h=card(`<h2>Criar conta</h2>${m}<p class="muted small">Depois de criar, um administrador precisa aprovar o seu acesso.</p><form id="fCad" class="aform"><label>Nome completo<input type="text" id="aNome" required></label><label>E-mail<input type="email" id="aEmail" autocomplete="username" required></label><label>Senha (mínimo 6 caracteres)<input type="password" id="aPass" autocomplete="new-password" minlength="6" required></label><button class="btn pri" type="submit">Criar conta</button></form>
    <div class="alinks"><button type="button" class="lnk" data-amode="login">Já tenho conta</button></div>`);
  else if(mode==='esqueci')h=card(`<h2>Recuperar senha</h2>${m}<form id="fEsq" class="aform"><label>E-mail<input type="email" id="aEmail" required></label><button class="btn pri" type="submit">Enviar link por e-mail</button></form><div class="alinks"><button type="button" class="lnk" data-amode="login">Voltar</button></div>`);
  else if(mode==='pendente')h=card(`<h2>Aguardando aprovação</h2><p>Sua conta <b>${H(USER&&USER.email)}</b> foi criada. Peça a um administrador para liberar o acesso em <b>Usuários</b>. Esta tela abre o sistema sozinha quando for aprovada.</p><div class="alinks"><button type="button" class="lnk" data-alogout>Sair</button></div>`);
  else if(mode==='inativo')h=card(`<h2>Acesso bloqueado</h2><p>O usuário <b>${H(USER&&USER.email)}</b> está inativo. Fale com o administrador do sistema.</p><div class="alinks"><button type="button" class="lnk" data-alogout>Sair</button></div>`);
  else h=card(`<h2>Não foi possível entrar</h2>${m}<div class="alinks"><button type="button" class="lnk" data-alogout>Sair</button></div>`);
  AUTH.innerHTML=h;const f=AUTH.querySelector('input');if(f)f.focus();
}
AUTH.addEventListener('click',e=>{const b=e.target.closest('[data-amode]');if(b){showAuth(b.dataset.amode);return;}if(e.target.closest('[data-alogout]'))auth.signOut();});
AUTH.addEventListener('submit',async e=>{e.preventDefault();const f=e.target;const email=(AUTH.querySelector('#aEmail')||{}).value,pass=(AUTH.querySelector('#aPass')||{}).value;const btn=f.querySelector('button[type=submit]');btn.disabled=true;
  try{if(f.id==='fLogin')await auth.signInWithEmailAndPassword(email.trim(),pass);
    else if(f.id==='fCad'){pendingName=AUTH.querySelector('#aNome').value.trim();const c=await auth.createUserWithEmailAndPassword(email.trim(),pass);try{await c.user.updateProfile({displayName:pendingName});}catch(_){}}
    else if(f.id==='fEsq'){await auth.sendPasswordResetEmail(email.trim());showAuth('login','Link de recuperação enviado para '+email+'. Confira também a caixa de spam.');return;}
  }catch(err){const mode=f.id==='fLogin'?'login':f.id==='fCad'?'cadastro':'esqueci';showAuth(mode,aerr(err));const i=AUTH.querySelector('#aEmail');if(i)i.value=email;}
  finally{btn.disabled=false;}});
function enterApp(){
  inApp=true;document.body.classList.remove('locked');AUTH.hidden=true;AUTH.innerHTML='';
  $('#who').innerHTML=`<b>${H(ME.nome||USER.email)}</b><span>${H(PERFIS[ME.perfil]||ME.perfil)}</span>`;
  $('#view').innerHTML='<div class="empty">Carregando dados…</div>';
  setSync();listen();
  db.collection('users').doc(USER.uid).update({ultimoAcesso:iso(now())}).catch(()=>{});
}
function leaveApp(){stopListen();inApp=false;closeAll();S=EMPTY();known={};knownMeta={};usersList=[];}
function fbBoot(){fbInit();
if(!auth){showAuth('config');return;}
showAuth('loading');
auth.onAuthStateChanged(u=>{
  if(unsubMe){unsubMe();unsubMe=null;}leaveApp();USER=u;ME=null;
  if(!u){showAuth('login');return;}
  showAuth('loading');
  const ref=db.collection('users').doc(u.uid);
  unsubMe=ref.onSnapshot(s=>{
    if(!s.exists){ref.set({nome:pendingName||u.displayName||u.email,email:u.email,perfil:'operador',status:'pendente',criado:iso(now())}).catch(e=>showAuth('erro',e.code==='permission-denied'?'O banco recusou o cadastro. Confira se as regras do Firestore foram publicadas (passo 6 do guia).':e.message));return;}
    const d=s.data(),was=ME&&ME.status,wasP=ME&&ME.perfil;ME=Object.assign({uid:u.uid},d);
    if(d.status==='ativo'){if(was!=='ativo')enterApp();else if(wasP!==d.perfil){listen();$('#who span').textContent=PERFIS[d.perfil]||d.perfil;}}
    else{leaveApp();showAuth(d.status==='inativo'?'inativo':'pendente');}
  },e=>showAuth('erro',e.code==='permission-denied'?'Sem permissão para ler o seu cadastro. Confira as regras do Firestore (passo 6 do guia).':e.message));
});
}
if(window.__fbReady)fbBoot();
else{showAuth('loading');window.addEventListener('fb-ready',fbBoot,{once:true});
  setTimeout(()=>{if(!window.__fbReady)showAuth('erro','Não foi possível carregar o Firebase. Confira a internet e recarregue a página (F5).');},20000);}
$('#logout').addEventListener('click',()=>auth&&auth.signOut());

/* ============ USUÁRIOS (admin) ============ */
let armedDel=false;
R.usuarios=()=>{
  const L=usersList.slice().sort((a,b)=>(a.status==='pendente'?0:1)-(b.status==='pendente'?0:1)||String(a.nome).localeCompare(b.nome));
  const pend=L.filter(u=>u.status==='pendente').length;
  const vazio=!S.bookings.length&&!S.containers.length&&!S.ots.length;
  return `<section class="panel"><header><h2>Usuários</h2>${pend?`<span class="chip warn">${pend} aguardando aprovação</span>`:''}<button class="btn pri" data-act="novoUser">+ Criar usuário</button></header>
  <div class="tw"><table><thead><tr><th>Nome</th><th>E-mail</th><th>Perfil</th><th>Situação</th><th>Último acesso</th><th>Criado em</th></tr></thead><tbody>
  ${L.map(u=>{const self=u.uid===ME.uid;return `<tr><td><b>${H(u.nome)}</b>${self?' <span class="tag">você</span>':''}</td><td>${H(u.email)}</td>
    <td><select data-uperfil="${u.uid}" ${self?'disabled':''} aria-label="Perfil de ${H(u.nome)}">${Object.entries(PERFIS).map(([k,l])=>`<option value="${k}" ${u.perfil===k?'selected':''}>${l}</option>`).join('')}</select></td>
    <td><select data-ustatus="${u.uid}" ${self?'disabled':''} aria-label="Situação de ${H(u.nome)}">${[['pendente','Pendente'],['ativo','Ativo'],['inativo','Inativo']].map(([k,l])=>`<option value="${k}" ${u.status===k?'selected':''}>${l}</option>`).join('')}</select></td>
    <td class="num small">${fmtDT(u.ultimoAcesso)}</td><td class="num small">${fmtD(u.criado)}</td></tr>`;}).join('')||'<tr><td colspan="6" class="empty">Nenhum usuário.</td></tr>'}
  </tbody></table></div>
  <div class="formula"><b>Perfis:</b> Operador lança e avança as operações · Supervisor também importa planilhas e edita cadastros · Administrador também aprova usuários e gerencia os dados do sistema. Para bloquear alguém, mude a situação para <b>Inativo</b>.</div></section>
  <section class="panel"><header><h2>Dados do sistema</h2></header><div class="pbody row">
  ${vazio?`<button class="btn" data-act="loadSample">Carregar dados de exemplo</button><span class="muted small">Útil para treinar a equipe antes de começar a operação real.</span>`:
   `<button class="btn danger" data-act="wipeAll">${armedDel?'Clique de novo para APAGAR TUDO':'Apagar todos os dados operacionais'}</button><span class="muted small">Remove bookings, contêineres, transportes, ovações/desovas, lotes e histórico. Usuários e cadastros continuam. Não tem como desfazer.</span>`}
  </div></section>`;
};
function novoUser(){form('Criar usuário',[{k:'nome',label:'Nome completo',req:true},{k:'email',label:'E-mail',req:true},{k:'senha',label:'Senha provisória (mínimo 6)',req:true,help:'Passe a senha para a pessoa; ela pode trocar em “Esqueci a senha”.'},{k:'perfil',label:'Perfil',type:'select',opts:Object.entries(PERFIS).map(([v,l])=>({v,l})),v:'operador'}],o=>{
  if(String(o.senha).length<6)return {k:'senha',err:'Mínimo de 6 caracteres'};
  const sec=firebase.apps.find(a=>a.name==='sec')||firebase.initializeApp(FIREBASE_CONFIG,'sec');
  toast('Criando usuário…');
  sec.auth().createUserWithEmailAndPassword(o.email.trim(),o.senha).then(c=>db.collection('users').doc(c.user.uid).set({nome:o.nome,email:o.email.trim(),perfil:o.perfil,status:'ativo',criado:iso(now()),criadoPor:USER.email}).then(()=>sec.auth().signOut()))
    .then(()=>toast('Usuário '+o.email+' criado e ativo')).catch(e=>toast(aerr(e)));
},'Criar usuário');}
function loadSample(){const smp=sample();COLS.forEach(c=>S[c]=smp[c]);S.cad=smp.cad;S.seq=smp.seq;save();toast('Dados de exemplo carregados');}
function wipeAll(){if(!armedDel){armedDel=true;render();setTimeout(()=>{armedDel=false;if(cur==='usuarios')render();},5000);return;}armedDel=false;COLS.forEach(c=>S[c]=[]);S.seq=EMPTY().seq;save();toast('Dados operacionais apagados');render();}

/* ============ eventos ============ */
document.addEventListener('click',e=>{
  const t=e.target;
  const g=t.closest('[data-go]');if(g){go(g.dataset.go);return;}
  const gt=t.closest('[data-goto]');if(gt&&!t.closest('a')){go(gt.dataset.goto);return;}
  const cn=t.closest('[data-cnum]');if(cn&&!t.closest('button')){e.preventDefault();cDrawer(cn.dataset.cnum);return;}
  const bk=t.closest('[data-bk]');if(bk&&!t.closest('button,input')){e.preventDefault();bookingDrawer(bk.dataset.bk);return;}
  const ca=t.closest('[data-cact]');if(ca){cAction(ca.dataset.cact,ca.dataset.c);return;}
  const ot=t.closest('[data-ot]');if(ot){moveOT(ot.dataset.ot,ot.dataset.to);return;}
  const op=t.closest('[data-op]');if(op){op.dataset.opto==='start'?opStart(op.dataset.op):opEnd(op.dataset.op);return;}
  const tb=t.closest('[data-tabov]');if(tb){tabOv=tb.dataset.tabov;render();return;}
  const ta=t.closest('[data-tabarm]');if(ta){tabArm=ta.dataset.tabarm;render();return;}
  const sd=t.closest('[data-saida]');if(sd){saidaLote(sd.dataset.saida);return;}
  const cd=t.closest('[data-cad]');if(cd){addCad(cd.dataset.cad);return;}
  const rt=t.closest('[data-rtab]');if(rt){rep.tab=rt.dataset.rtab;render();return;}
  const cp=t.closest('[data-copy]');if(cp){const tb=document.getElementById(cp.dataset.copy);if(!tb)return;const tsv=[...tb.rows].map(r=>[...r.cells].map(c=>c.innerText.replace(/\s+/g,' ').trim()).join('\t')).join('\n');
    const done=()=>toast('Tabela copiada: cole no Excel');const fb=()=>{const ta=document.createElement('textarea');ta.value=tsv;document.body.appendChild(ta);ta.select();try{document.execCommand('copy');done();}catch(_){toast('Selecione a tabela e copie manualmente');}ta.remove();};
    try{navigator.clipboard.writeText(tsv).then(done,fb);}catch(_){fb();}return;}
  const a=t.closest('[data-act]');if(!a)return;const act=a.dataset.act;
  if(act==='close')closeAll();
  else if(act==='novoBk')novoBooking();
  else if(act==='editBk'){const b=bkById(a.dataset.id);form('Editar booking '+b.booking,bookingFields(b),o=>{if(o.booking!==b.booking&&S.bookings.some(x=>x.booking===o.booking))return {k:'booking',err:'Número já usado'};Object.assign(b,o);log(b.booking,'Booking editado');toast('Booking atualizado');});}
  else if(act==='addC')addContainer(a.dataset.id);
  else if(act==='novoC')novoC();
  else if(act==='editC')editC(a.dataset.id);
  else if(act==='novaOT')novaOT();
  else if(act==='novaDes')novaDes();
  else if(act==='novaOvLivre')novaOvLivre();
  else if(act==='novoLote')novoLote();
  else if(act==='impCancel'){imp={kind:null,parsed:[]};render();}
  else if(act==='impGo')impGo();
  else if(act==='novoUser')novoUser();
  else if(act==='loadSample')loadSample();
  else if(act==='wipeAll')wipeAll();
});
document.addEventListener('change',e=>{
  const t=e.target;
  if(t.dataset.chk){const b=bkById(t.dataset.id);b.check[t.dataset.chk]=t.checked;b.checkAt=Object.assign({},b.checkAt,{[t.dataset.chk]:t.checked?iso(now()):null});const lab={draft:'Draft enviado ao armador',vgm:'VGM informado',due:'DU-E registrada',nf:'NF emitida'}[t.dataset.chk];log(b.booking,(t.checked?'':'Desmarcado: ')+lab);refresh();}
  if(t.id==='bkst'){fBk.st=t.value;render();}
  if(t.id==='cst'){fC.st=t.value;render();}
  if(t.dataset.uperfil){db.collection('users').doc(t.dataset.uperfil).update({perfil:t.value}).then(()=>toast('Perfil atualizado')).catch(fbErr);}
  if(t.dataset.ustatus){db.collection('users').doc(t.dataset.ustatus).update({status:t.value}).then(()=>toast(t.value==='ativo'?'Acesso liberado':'Situação atualizada')).catch(fbErr);}
  if(t.id==='rper'){rep.per=+t.value;render();}
  if(t.id==='rarm'){rep.arm=t.value;render();}
  if(t.id==='rtar'){rep.tarifa=Math.max(0,+t.value||0);render();}
  if(t.dataset.file&&t.files[0])readFile(t.dataset.file,t.files[0]);
});
let qT;document.addEventListener('input',e=>{const t=e.target;if(t.id==='bkq'||t.id==='cq'){clearTimeout(qT);qT=setTimeout(()=>{if(t.id==='bkq')fBk.q=t.value;else fC.q=t.value;const pos=t.selectionStart;render();const n=$('#'+t.id);if(n){n.focus();try{n.setSelectionRange(pos,pos);}catch(_){}}},250);}});
document.addEventListener('dragover',e=>{const d=e.target.closest('[data-drop]');if(d){e.preventDefault();d.classList.add('over');}});
document.addEventListener('dragleave',e=>{const d=e.target.closest('[data-drop]');if(d)d.classList.remove('over');});
document.addEventListener('drop',e=>{const d=e.target.closest('[data-drop]');if(d){e.preventDefault();d.classList.remove('over');const f=e.dataTransfer.files[0];if(f)readFile(d.dataset.drop,f);}});
$('#searchForm').addEventListener('submit',e=>{e.preventDefault();const q=$('#q').value.trim();if(!q)return;const c=cByNum(q);if(c){cDrawer(c.num);return;}
  const b=S.bookings.find(x=>norm(x.booking)===norm(q))||S.bookings.find(x=>norm(x.booking).includes(norm(q)));if(b){bookingDrawer(b.id);return;}
  const cc=S.containers.find(x=>x.num.includes(cleanC(q)));if(cc){cDrawer(cc.num);return;}toast('Nada encontrado para “'+q+'”');});
function tick(){const d=new Date();$('#clock').textContent=d.toLocaleDateString('pt-BR',{weekday:'short',day:'2-digit',month:'2-digit'})+' · '+d.toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'});}
tick();setInterval(()=>{tick();},30000);
setInterval(()=>{if(inApp&&!document.querySelector('.ov.center')&&!drawerFn&&!document.activeElement.matches('input,select,textarea')){render();}},60000);
})();
