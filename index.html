<script type="module">
/* Firebase (SDK modular) com uma camada de compatibilidade usada pelo sistema.
   Permite escolher o banco do Firestore pelo nome (FIRESTORE_DATABASE em firebase-config.js). */
import {initializeApp} from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js';
import {getAuth,onAuthStateChanged,signInWithEmailAndPassword,createUserWithEmailAndPassword,sendPasswordResetEmail,signOut,updateProfile} from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js';
import {getFirestore,collection,doc,onSnapshot,setDoc,updateDoc,writeBatch,query,orderBy,limit} from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js';
const wrapUser=u=>{if(u&&!u.updateProfile)u.updateProfile=x=>updateProfile(u,x);return u;};
const authOf=app=>{const a=getAuth(app);return {
  set languageCode(v){a.languageCode=v;},get languageCode(){return a.languageCode;},
  onAuthStateChanged:cb=>onAuthStateChanged(a,u=>cb(wrapUser(u))),
  signInWithEmailAndPassword:(e,p)=>signInWithEmailAndPassword(a,e,p).then(c=>(wrapUser(c.user),c)),
  createUserWithEmailAndPassword:(e,p)=>createUserWithEmailAndPassword(a,e,p).then(c=>(wrapUser(c.user),c)),
  sendPasswordResetEmail:e=>sendPasswordResetEmail(a,e),signOut:()=>signOut(a)};};
const qsnap=s=>s;
const Q=q=>({orderBy:(f,d)=>Q(query(q,orderBy(f,d))),limit:n=>Q(query(q,limit(n))),onSnapshot:(cb,err)=>onSnapshot(q,s=>cb(qsnap(s)),err)});
const D=r=>({_r:r,id:r.id,onSnapshot:(cb,err)=>onSnapshot(r,s=>cb({exists:s.exists(),id:s.id,data:()=>s.data()}),err),set:d=>setDoc(r,d),update:d=>updateDoc(r,d)});
let fs=null;
const dbw={collection:c=>{const cr=collection(fs,c);return Object.assign(Q(cr),{doc:id=>D(doc(fs,c,id))});},
  batch:()=>{const b=writeBatch(fs);return {set:(r,d)=>b.set(r._r,d),delete:r=>b.delete(r._r),commit:()=>b.commit()};}};
const apps=[];
window.firebase={apps,
  initializeApp(cfg,name){const app=initializeApp(cfg,name);const w={name:app.name,auth:()=>authOf(app),_app:app};apps.push(w);
    if(!name)fs=getFirestore(app,(window.FIRESTORE_DATABASE||'(default)'));return w;},
  auth:()=>authOf(apps.find(a=>a.name==='[DEFAULT]')._app),
  firestore:()=>dbw};
window.__fbReady=true;window.dispatchEvent(new Event('fb-ready'));
</script>

<style>
:root{
  --bg:#F1F1F1;--surface:#FFFFFF;--surface2:#F7F7F7;--line:#DADBDB;--line2:#E8E8E8;
  --text:#141414;--muted:#5D5F60;--nav:#141414;--navText:#B1B3B3;--navHi:#FFFFFF;--navLine:#2A2A2A;
  --accent:#D6001C;--accentText:#FFFFFF;--accentSoft:#FCE4E7;--ink:#262626;--inkSoft:#E9E9EA;--steel:#B1B3B3;
  --ok:#1F7A48;--okSoft:#DFF0E6;--warn:#A5620A;--warnSoft:#FBEEDB;--crit:#B5001A;--critSoft:#FBE1E4;
  --info:#2D5F9A;--infoSoft:#E2EAF4;--idle:#6A6C6D;--idleSoft:#ECECEC;
  --shadow:0 1px 2px rgba(0,0,0,.05),0 4px 14px rgba(0,0,0,.05);
  --f-ui:"Gantari",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Consolas,monospace;
  --f-disp:"Gantari",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  color-scheme:dark;--bg:#101011;--surface:#1A1B1C;--surface2:#212224;--line:#323436;--line2:#2A2B2D;
  --text:#ECECEC;--muted:#A3A5A6;--nav:#0A0A0A;--navText:#A3A5A6;--navHi:#FFFFFF;--navLine:#222;
  --accent:#F0283F;--accentText:#FFFFFF;--accentSoft:#3B1318;--ink:#E4E4E4;--inkSoft:#2C2D2F;--steel:#8C8E8E;
  --ok:#4BBE80;--okSoft:#12301F;--warn:#E3A844;--warnSoft:#362810;--crit:#FF6B78;--critSoft:#3F161B;
  --info:#7FA9DE;--infoSoft:#172638;--idle:#9A9C9D;--idleSoft:#262729;--shadow:0 1px 2px rgba(0,0,0,.35);
}}
:root[data-theme="dark"]{
  color-scheme:dark;--bg:#101011;--surface:#1A1B1C;--surface2:#212224;--line:#323436;--line2:#2A2B2D;
  --text:#ECECEC;--muted:#A3A5A6;--nav:#0A0A0A;--navText:#A3A5A6;--navHi:#FFFFFF;--navLine:#222;
  --accent:#F0283F;--accentText:#FFFFFF;--accentSoft:#3B1318;--ink:#E4E4E4;--inkSoft:#2C2D2F;--steel:#8C8E8E;
  --ok:#4BBE80;--okSoft:#12301F;--warn:#E3A844;--warnSoft:#362810;--crit:#FF6B78;--critSoft:#3F161B;
  --info:#7FA9DE;--infoSoft:#172638;--idle:#9A9C9D;--idleSoft:#262729;--shadow:0 1px 2px rgba(0,0,0,.35);
}
*{box-sizing:border-box}
[hidden]{display:none!important}
img{max-width:100%}
html,body{height:100%}
body{background:var(--bg);color:var(--text);font:14px/1.45 var(--f-ui);margin:0}
button,input,select,textarea{font:inherit;color:inherit}
.mono{font-family:var(--f-mono);font-size:.93em;letter-spacing:.01em}
.num{font-variant-numeric:tabular-nums}
.app{display:grid;grid-template-columns:232px 1fr;min-height:100%}
/* sidebar */
.side{background:var(--nav);color:var(--navText);display:flex;flex-direction:column;position:sticky;top:0;height:100vh;padding-block:18px 14px}
.brand{padding:0 20px 18px;border-bottom:1px solid var(--navLine)}
.brand{display:flex;flex-direction:column;gap:8px}
.brand img{display:block;width:176px;max-width:100%;height:auto}
.brand span{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--steel)}
.nav{display:flex;flex-direction:column;gap:2px;padding:12px 10px;flex:1;overflow:auto}
.nav a{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:9px 12px;border-radius:6px;color:var(--navText);text-decoration:none;font-weight:500}
.nav a:hover{background:rgba(255,255,255,.06);color:var(--navHi)}
.nav a.on{background:rgba(255,255,255,.08);color:var(--navHi);box-shadow:inset 3px 0 0 var(--accent)}
.nav .grp{font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;opacity:.6;padding:14px 12px 4px}
.badge{min-width:20px;padding:1px 6px;border-radius:10px;background:var(--accent);color:#fff;font-size:11px;font-weight:600;text-align:center}
.side-foot{padding:10px 20px 0;border-top:1px solid var(--navLine);font-size:12px;display:flex;flex-direction:column;gap:8px}
.side-foot button{background:transparent;border:1px solid var(--navLine);color:var(--navText);border-radius:6px;padding:6px 10px;cursor:pointer;text-align:left}
.side-foot button:hover{color:var(--navHi);border-color:var(--navText)}
/* main */
.main{min-width:0;display:flex;flex-direction:column}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:3px solid var(--accent);display:flex;align-items:center;gap:14px;padding:10px 24px;flex-wrap:wrap}
.top h1{font-family:var(--f-disp);font-weight:800;font-size:23px;letter-spacing:-.01em;margin:0;flex:1;min-width:180px;text-wrap:balance}
.search{display:flex;gap:6px;flex:0 1 340px;min-width:200px}
.search input{flex:1;min-width:0}
.clock{font-family:var(--f-mono);font-size:12px;color:var(--muted)}
.demo{background:var(--surface2);color:var(--muted);font-size:12px;padding:6px 24px;border-bottom:1px solid var(--line)}
.view{padding-block:20px 40px;padding-inline:24px;display:flex;flex-direction:column;gap:18px}
/* controls */
input[type=text],input[type=number],input[type=datetime-local],input[type=search],select,textarea{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:7px 10px;min-height:36px;width:100%}
input:focus-visible,select:focus-visible,textarea:focus-visible,button:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:6px 12px;min-height:34px;cursor:pointer;font-weight:500;white-space:nowrap}
.btn:hover{border-color:var(--accent);color:var(--accent)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accentText)}
.btn.pri:hover{filter:brightness(1.08);color:var(--accentText)}
.btn.sm{min-height:28px;padding:3px 9px;font-size:12.5px}
.btn.ghost{border-color:transparent;background:transparent}
.btn.danger{color:var(--crit)}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.spacer{flex:1}
/* panels */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:8px;box-shadow:var(--shadow)}
.panel>header{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:12px 16px;border-bottom:1px solid var(--line2)}
.panel>header h2{margin:0;font-size:15px;font-weight:600;flex:1;min-width:160px}
.panel>header .hint{color:var(--muted);font-size:12.5px}
.pbody{padding:14px 16px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(360px,1fr));gap:18px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:12px 14px;display:flex;flex-direction:column;gap:2px;cursor:pointer;text-align:left}
.kpi:hover{border-color:var(--accent)}
div.kpi{cursor:default}div.kpi:hover{border-color:var(--line)}
.kpi .l{font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.kpi .v{font-family:var(--f-disp);font-size:32px;font-weight:800;letter-spacing:-.02em;line-height:1.05;font-variant-numeric:tabular-nums}
.kpi .s{font-size:12px;color:var(--muted)}
.kpi.crit .v{color:var(--crit)} .kpi.warn .v{color:var(--warn)}
/* tables */
.tw{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:13px}
th{font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);font-weight:600;text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap;background:var(--surface2)}
td{padding:8px 10px;border-bottom:1px solid var(--line2);vertical-align:middle}
tr.click{cursor:pointer} tr.click:hover td{background:var(--surface2)}
td.r,th.r{text-align:right}
.empty{padding:26px;text-align:center;color:var(--muted)}
/* chips */
.chip{display:inline-flex;align-items:center;gap:5px;padding:2px 8px;border-radius:11px;font-size:11.5px;font-weight:600;white-space:nowrap;background:var(--idleSoft);color:var(--idle)}
.chip::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.chip.ok{background:var(--okSoft);color:var(--ok)} .chip.warn{background:var(--warnSoft);color:var(--warn)}
.chip.crit,.chip.venc{background:var(--critSoft);color:var(--crit)} .chip.info{background:var(--infoSoft);color:var(--info)}
.chip.acc{background:var(--inkSoft);color:var(--ink)}
.chip.venc{outline:1px solid var(--crit)}
.tag{font-size:11px;padding:1px 6px;border:1px solid var(--line);border-radius:4px;color:var(--muted);white-space:nowrap}
.bad{color:var(--crit);font-weight:600}
.muted{color:var(--muted)}
.small{font-size:12px}
/* progress flow */
.flow{display:flex;gap:3px;min-width:180px}
.flow i{flex:1;height:8px;border-radius:2px;background:var(--line2)}
.flow i.d{background:var(--accent)} .flow i.p{background:var(--steel)}
.steps{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;font-size:11px;color:var(--muted);text-align:center}
.steps b{display:block;font-family:var(--f-disp);font-size:20px;color:var(--text);font-weight:800}
/* bars */
.bar{height:10px;border-radius:5px;background:var(--line2);overflow:hidden}
.bar>i{display:block;height:100%;background:var(--accent)}
.bar.warn>i{background:var(--warn)} .bar.crit>i{background:var(--crit)}
/* kanban */
.kan{display:grid;grid-template-columns:repeat(3,minmax(260px,1fr));gap:14px;overflow-x:auto}
.col{background:var(--surface2);border:1px solid var(--line);border-radius:8px;display:flex;flex-direction:column;min-height:120px}
.col h3{margin:0;padding:10px 12px;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);display:flex;justify-content:space-between;border-bottom:1px solid var(--line)}
.cards{display:flex;flex-direction:column;gap:8px;padding:10px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:10px 12px;display:flex;flex-direction:column;gap:5px}
.card .t{display:flex;justify-content:space-between;gap:6px;align-items:center}
.card .route{font-size:12.5px}
.card .meta{font-size:12px;color:var(--muted)}
/* yard */
.yard{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:14px}
.blk{border:1px solid var(--line);border-radius:6px;padding:10px}
.blk h4{margin:0 0 8px;font-family:var(--f-disp);font-size:16px;font-weight:700;display:flex;justify-content:space-between}
.bays{display:grid;grid-template-columns:repeat(8,1fr);gap:3px}
.bay{display:flex;flex-direction:column-reverse;gap:2px}
.slot{height:16px;border-radius:2px;background:var(--line2);border:1px dashed var(--line)}
.slot.f{border:none}
.bayn{font-size:10px;text-align:center;color:var(--muted);font-family:var(--f-mono)}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12px}
.legend span{display:inline-flex;align-items:center;gap:5px}
.legend i{width:12px;height:12px;border-radius:2px;display:inline-block}
/* drawer/modal */
.ov{position:fixed;inset:0;background:rgba(8,20,30,.45);z-index:20;display:flex;justify-content:flex-end}
.ov.center{justify-content:center;align-items:flex-start;padding:5vh 16px;overflow:auto}
.drawer{background:var(--bg);width:min(880px,100%);height:100%;overflow:auto;display:flex;flex-direction:column;box-shadow:-8px 0 30px rgba(0,0,0,.2)}
.drawer>header{position:sticky;top:0;background:var(--surface);border-bottom:1px solid var(--line);padding:14px 20px;display:flex;gap:12px;align-items:flex-start;z-index:2}
.drawer>header h2{margin:0;font-family:var(--f-disp);font-size:24px;font-weight:800;line-height:1.1}
.dbody{padding:18px 20px;display:flex;flex-direction:column;gap:16px}
.modal{background:var(--surface);border-radius:10px;width:min(620px,100%);box-shadow:0 20px 50px rgba(0,0,0,.3)}
.modal>header{padding:14px 18px;border-bottom:1px solid var(--line);display:flex;align-items:center}
.modal>header h2{margin:0;font-size:17px;flex:1}
.modal form{padding:16px 18px;display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
.fld{display:flex;flex-direction:column;gap:4px}
.fld label{font-size:12px;font-weight:600;color:var(--muted)}
.fld.full{grid-column:1/-1}
.fld .err{color:var(--crit);font-size:12px;min-height:0}
.mfoot{grid-column:1/-1;display:flex;justify-content:flex-end;gap:8px;padding-top:6px}
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px 16px}
.facts div{display:flex;flex-direction:column}
.facts small{font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
.facts b{font-weight:600}
.dl{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:12px}
.dlbox{border:1px solid var(--line);border-radius:8px;padding:12px 14px;background:var(--surface);display:flex;flex-direction:column;gap:6px}
.dlbox .big{font-family:var(--f-disp);font-size:28px;font-weight:800;line-height:1}
.dlbox.crit,.dlbox.venc{border-color:var(--crit);background:var(--critSoft)} .dlbox.warn{border-color:var(--warn);background:var(--warnSoft)}
.checks{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:8px}
.checks label{display:flex;gap:8px;align-items:center;border:1px solid var(--line);border-radius:6px;padding:8px 10px;background:var(--surface);cursor:pointer}
.checks input{width:16px;height:16px;accent-color:var(--accent)}
.timeline{display:flex;flex-direction:column;gap:0;font-size:13px}
.timeline div{display:grid;grid-template-columns:120px 1fr;gap:10px;padding:6px 0;border-bottom:1px dashed var(--line2)}
.drop{border:2px dashed var(--line);border-radius:8px;padding:22px;text-align:center;display:flex;flex-direction:column;gap:8px;align-items:center;background:var(--surface2)}
.drop.over{border-color:var(--accent);background:var(--accentSoft)}
.cols-ex{font-family:var(--f-mono);font-size:12px;color:var(--muted);line-height:1.6}
.toast{position:fixed;bottom:calc(20px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:#141414;border-left:4px solid var(--accent);color:#fff;padding:10px 16px;border-radius:8px;z-index:40;box-shadow:0 8px 24px rgba(0,0,0,.25);max-width:calc(100% - 32px)}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.tabs button{border:none;background:none;padding:8px 12px;cursor:pointer;color:var(--muted);font-weight:500;border-bottom:2px solid transparent;margin-bottom:-1px}
.tabs button.on{color:var(--accent);border-bottom-color:var(--accent)}
.scgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px}
.sc{background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--steel);border-radius:8px;padding:12px 14px;display:flex;flex-direction:column;gap:3px}
.sc.ok{border-left-color:var(--ok)} .sc.warn{border-left-color:var(--warn)} .sc.crit{border-left-color:var(--crit)}
.sc .l{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.sc b{font-weight:600;font-size:13.5px;text-wrap:balance}
.sc .v{font-family:var(--f-disp);font-size:30px;font-weight:800;letter-spacing:-.02em;font-variant-numeric:tabular-nums;line-height:1.1}
.sc .s{font-size:12px;color:var(--muted);display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.chart{padding:12px 16px}
.chart svg{width:100%;height:auto;display:block}
.chart .gl{stroke:var(--line2);stroke-width:1}
.chart .ax{fill:var(--muted);font-size:13px;font-family:var(--f-ui)}
.chart .tgt{stroke:var(--text);stroke-width:1.5;stroke-dasharray:5 4}
.chart .tgtl{fill:var(--text);font-size:13px;font-weight:600;font-family:var(--f-ui)}
.chart .band{fill:var(--okSoft)}
.hb{display:flex;flex-direction:column;gap:8px;padding:14px 16px}
.hbr{display:grid;grid-template-columns:110px 1fr auto;gap:10px;align-items:center;font-size:13px}
.hbt{height:14px;background:var(--line2);border-radius:3px;overflow:hidden}
.hbt i{display:block;height:100%;border-radius:3px}
.hbv{min-width:60px;text-align:right}
.formula{padding:10px 16px;border-top:1px dashed var(--line);font-size:12px;color:var(--muted)}
body.locked .app{display:none}
#auth{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px 16px;background:var(--nav)}
.acard{background:var(--surface);border-radius:10px;padding:28px 26px;width:min(400px,100%);box-shadow:0 20px 60px rgba(0,0,0,.35);display:flex;flex-direction:column;gap:12px;border-top:4px solid var(--accent)}
.alogo{width:190px;max-width:100%;height:auto}
.asub{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin-top:-6px}
.acard h2{margin:8px 0 0;font-size:20px;font-weight:800}
.acard p{margin:0}
.aform{display:flex;flex-direction:column;gap:12px}
.aform label{display:flex;flex-direction:column;gap:4px;font-size:12.5px;font-weight:600;color:var(--muted)}
.aform input{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:9px 10px;font-size:15px;color:var(--text)}
.aform .btn{justify-content:center;min-height:40px;font-size:15px}
.alinks{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}
.lnk{background:none;border:none;color:var(--accent);cursor:pointer;padding:4px 0;font-weight:600}
.amsg{background:var(--critSoft);color:var(--crit);padding:8px 10px;border-radius:6px;font-size:13px}
.amsg.ok{background:var(--okSoft);color:var(--ok)}
.who{display:flex;flex-direction:column;line-height:1.2;font-size:12.5px;text-align:right}
.who span{color:var(--muted);font-size:11.5px}

/* deadlines */
function urg(ts,pending){if(!pending)return 'ok';const d=new Date(ts)-now();if(d<0)return 'venc';if(d<24*HR)return 'crit';if(d<48*HR)return 'warn';return 'ok';}
function dlText(ts,pending){if(!ts)return '—';const d=new Date(ts)-now();if(!pending)return 'Cumprido';return d<0?'Vencido há '+dur(d):'Faltam '+dur(d);}
function dlChip(ts,pending){const u=urg(ts,pending);return `<span class="chip ${u==='ok'&&pending?'':u}">${H(dlText(ts,pending))}</span>`;}
function bookingState(b){
  const cs=cOf(b),total=Math.max(b.qtd,cs.length);
  const idx=c=>CST.indexOf(c.status);
  const entregue=cs.filter(c=>idx(c)>=6).length;
  const ovados=cs.filter(c=>idx(c)>=3).length;
  const pendCarga=total-entregue;
  const draftPend=!b.check.draft;
  const vgmPend=cs.some(c=>idx(c)>=3&&!c.vgm)||(!b.check.vgm&&ovados>0);
  const uD=urg(b.deadlineDraft,draftPend),uC=urg(b.deadlineCarga,pendCarga>0);
  const rank={venc:0,crit:1,warn:2,ok:3};
  const worst=rank[uD]<rank[uC]?uD:uC;
  const encerrado=pendCarga===0&&!draftPend;
  return {cs,total,entregue,ovados,pendCarga,draftPend,vgmPend,uD,uC,worst,encerrado,
    steps:{ret:cs.filter(c=>idx(c)>=1).length,ov:ovados,ps:cs.filter(c=>idx(c)>=4).length,term:entregue}};
}
const statusChipC=s=>{const m={'Aguardando retirada':'','Vazio no pátio':'info','Em ovação':'warn','Ovado':'acc','Pré-stacking':'acc','Em trânsito p/ terminal':'info','Entregue no terminal':'ok','Cheio (importação)':'warn','Em desova':'warn','Vazio pós-desova':'info','Devolvido ao armador':'ok','Estoque vazio':''};return `<span class="chip ${m[s]||''}">${H(s)}</span>`;};
const chipOT=s=>`<span class="chip ${s==='Concluída'?'ok':s==='Em rota'||s==='Em andamento'?'info':'warn'}">${H(s)}</span>`;
function flowBar(b,st){const cells=[];for(let i=0;i<st.total;i++){const c=st.cs[i];const k=c?CST.indexOf(c.status):-1;cells.push(`<i class="${k>=6?'d':k>=1?'p':''}" title="${H(c?c.num+' – '+c.status:'Contêiner ainda não vinculado')}"></i>`);}return `<div class="flow">${cells.join('')}</div>`;}

function form(title,fields,onSave,btn='Salvar'){
  const ov=document.createElement('div');ov.className='ov center';
  const inp=f=>{const id='f_'+f.k,v=f.v??'';
    if(f.type==='select')return `<select id="${id}" name="${f.k}">${(f.opts||[]).map(o=>{const val=typeof o==='object'?o.v:o,lab=typeof o==='object'?o.l:o;return `<option value="${H(val)}" ${String(val)===String(v)?'selected':''}>${H(lab)}</option>`;}).join('')}</select>`;
    if(f.type==='textarea')return `<textarea id="${id}" name="${f.k}" rows="2">${H(v)}</textarea>`;
    if(f.type==='datetime')return `<input id="${id}" name="${f.k}" type="datetime-local" value="${H(toLocalInput(v))}">`;
    return `<input id="${id}" name="${f.k}" type="${f.type==='number'?'number':'text'}" ${f.type==='number'?'step="any"':''} value="${H(v)}" ${f.ph?`placeholder="${H(f.ph)}"`:''} ${f.list?`list="dl_${f.k}"`:''} autocomplete="off">${f.list?`<datalist id="dl_${f.k}">${f.list.map(o=>`<option value="${H(o)}">`).join('')}</datalist>`:''}`;};
  ov.innerHTML=`<div class="modal" role="dialog" aria-modal="true" aria-label="${H(title)}"><header><h2>${H(title)}</h2><button class="btn ghost" type="button" data-x aria-label="Fechar">✕</button></header>
  <form novalidate>${fields.map(f=>`<div class="fld ${f.full?'full':''}"><label for="f_${f.k}">${H(f.label)}${f.req?' *':''}</label>${inp(f)}${f.help?`<span class="muted small">${H(f.help)}</span>`:''}<span class="err" data-err="${f.k}"></span></div>`).join('')}
  <div class="mfoot"><button class="btn" type="button" data-x>Cancelar</button><button class="btn pri" type="submit">${H(btn)}</button></div></form></div>`;
  document.body.appendChild(ov);
  const first=ov.querySelector('input,select,textarea');if(first)first.focus();
  ov.addEventListener('click',e=>{if(e.target===ov||e.target.closest('[data-x]'))ov.remove();});
  ov.querySelector('form').addEventListener('submit',e=>{e.preventDefault();
    const o={};let ok=true;ov.querySelectorAll('[data-err]').forEach(x=>x.textContent='');
    fields.forEach(f=>{let v=ov.querySelector('#f_'+f.k).value.trim();
      if(f.type==='number')v=v===''?null:Number(v);
      if(f.type==='datetime')v=v?iso(new Date(v)):null;
      if(f.req&&(v===null||v==='')){ok=false;ov.querySelector(`[data-err="${f.k}"]`).textContent='Campo obrigatório';}
      if(f.cntr&&v){v=cleanC(v);if(!isoOK(v)){ok=false;ov.querySelector(`[data-err="${f.k}"]`).textContent='Número inválido: confira o dígito verificador (ISO 6346)';}}
      o[f.k]=v;});
    if(!ok)return;const r=onSave(o);if(r&&r.err){const el=ov.querySelector(`[data-err="${r.k}"]`);if(el)el.textContent=r.err;return;}ov.remove();refresh();});
}

function novoBooking(){form('Novo booking',bookingFields(),o=>{
  if(S.bookings.some(b=>b.booking===o.booking))return {k:'booking',err:'Já existe um booking com esse número'};
  if(o.deadlineCarga&&o.deadlineDraft&&new Date(o.deadlineCarga)<new Date(o.deadlineDraft)){}
  S.seq.bk++;const b=Object.assign({id:'B'+S.seq.bk,check:{draft:false,vgm:false,due:false,nf:false},criado:iso(now())},o);S.bookings.push(b);log(b.booking,'Booking cadastrado');toast('Booking '+b.booking+' cadastrado');
  if(!S.cad.navios.includes(o.navio))S.cad.navios.push(o.navio);if(!S.cad.clientes.includes(o.exportador))S.cad.clientes.push(o.exportador);
},'Cadastrar booking');}

function bookingDrawer(id){openDrawer(()=>{
  const b=bkById(id);if(!b)return '';const s=bookingState(b);
  const acts=c=>{const a=[];switch(c.status){
    case 'Aguardando retirada':a.push(['otRet','Gerar OT de retirada']);break;
    case 'Vazio no pátio':if(!S.ops.some(o=>o.container===c.num&&o.status!=='Concluída'))a.push(['progOv','Programar ovação']);else a.push(['gotoOv','Ver ovação']);break;
    case 'Em ovação':a.push(['gotoOv','Ver ovação']);break;
    case 'Ovado':a.push(['toPS','Posicionar no pré-stacking']);break;
    case 'Pré-stacking':if(!S.ots.some(o=>o.container===c.num&&o.status!=='Concluída'))a.push(['otTerm','Gerar OT p/ terminal']);else a.push(['gotoOt','Ver transporte']);break;
    case 'Em trânsito p/ terminal':a.push(['gotoOt','Ver transporte']);break;}
    return a.map(([k,l])=>`<button class="btn sm" data-cact="${k}" data-c="${c.id}">${l}</button>`).join(' ');};
  const falta=s.total-s.cs.length;
  return `<header><div style="flex:1"><div class="muted small">${H(b.armador)} · booking</div><h2 class="mono">${H(b.booking)}</h2><div class="muted">${H(b.navio)} ${H(b.viagem)} → ${H(b.destino)} · ${H(b.exportador)}</div></div>
    <button class="btn" data-act="editBk" data-id="${b.id}">Editar</button><button class="btn ghost" data-act="close" aria-label="Fechar">✕</button></header>
  <div class="dbody">
    <div class="dl">
      <div class="dlbox ${s.uD}"><span class="small muted">DEADLINE DE DRAFT</span><span class="big">${H(dlText(b.deadlineDraft,s.draftPend))}</span><span class="num">${fmtDT(b.deadlineDraft)}</span><span class="small">${s.draftPend?'Instruções do BL ainda não enviadas':'Draft enviado ao armador'}</span></div>
      <div class="dlbox ${s.uC}"><span class="small muted">DEADLINE DE CARGA</span><span class="big">${H(dlText(b.deadlineCarga,s.pendCarga>0))}</span><span class="num">${fmtDT(b.deadlineCarga)}</span><span class="small">${s.pendCarga?`${s.pendCarga} de ${s.total} contêineres ainda fora do terminal`:'Todos entregues no terminal'}</span></div>
      <div class="dlbox"><span class="small muted">NAVIO</span><span class="big" style="font-size:22px">${H(b.navio)}</span><span class="num">ETS ${fmtDT(b.ets)}</span><span class="small">${H(b.terminal)}</span></div>
    </div>
    <section class="panel"><header><h2>Checklist documental</h2><span class="hint">Marque conforme for concluindo</span></header><div class="pbody"><div class="checks">
      ${[['draft','Draft (instruções do BL) enviado'],['vgm','VGM informado ao armador'],['due','DU-E registrada'],['nf','NF de exportação emitida']].map(([k,l])=>`<label><input type="checkbox" data-chk="${k}" data-id="${b.id}" ${b.check[k]?'checked':''}> ${l}</label>`).join('')}
    </div>${s.vgmPend?'<p class="bad small" style="margin:10px 0 0">Há contêineres ovados sem VGM informado ao armador.</p>':''}</div></section>
    <section class="panel"><header><h2>Contêineres (${s.cs.length}/${s.total})</h2>${falta>0?`<button class="btn pri sm" data-act="addC" data-id="${b.id}">+ Vincular contêiner</button>`:''}</header>
    <div class="tw"><table><thead><tr><th>Contêiner</th><th>Tipo</th><th>Status</th><th class="r">Tara</th><th class="r">Carga</th><th class="r">VGM</th><th>Lacre</th><th>Posição</th><th>Ação</th></tr></thead><tbody>
    ${s.cs.map(c=>`<tr><td class="mono"><a href="#" data-cnum="${c.num}">${H(c.num)}</a>${isoOK(c.num)?'':' <span class="chip crit" title="Dígito verificador não confere">DV</span>'}</td><td>${H(c.tipo)}</td><td>${statusChipC(c.status)}</td><td class="r num">${nf(c.tara)}</td><td class="r num">${nf(c.pesoCarga)}</td><td class="r num">${nf(c.vgm)}</td><td class="mono">${H(c.lacre||'—')}</td><td class="mono">${H(c.posicao||'—')}</td><td>${acts(c)}</td></tr>`).join('')}
    ${falta>0?`<tr><td colspan="9" class="muted small">Faltam ${falta} contêiner(es) para completar o booking.</td></tr>`:''}
    </tbody></table></div></section>
    <section class="panel"><header><h2>Histórico</h2></header><div class="pbody timeline">${histFor([b.booking,...s.cs.map(c=>c.num)])}</div></section>
  </div>`;});}
function histFor(refs){const L=S.log.filter(l=>refs.includes(l.ref)).sort((a,b)=>new Date(b.ts)-new Date(a.ts));return L.length?L.map(l=>`<div><span class="num muted">${fmtDT(l.ts)}</span><span><span class="mono small muted">${H(l.ref)}</span> · ${H(l.msg)}</span></div>`).join(''):'<span class="muted">Sem registros.</span>';}

/* ações de contêiner (fluxo da exportação) */
function cAction(k,cid){const c=S.containers.find(x=>x.id===cid);if(!c)return;const b=bkById(c.bookingId);
  if(k==='otRet'){form('OT de retirada de vazio – '+c.num,[
    {k:'origem',label:'Retirar em',req:true,v:'Depot '+c.armador},{k:'agenda',label:'Agendamento',type:'datetime',req:true,v:iso(now()+2*HR)},
    {k:'motorista',label:'Motorista',type:'select',opts:S.cad.motoristas.map(m=>m.nome)},{k:'cavalo',label:'Cavalo (placa)',type:'select',opts:S.cad.veiculos.filter(v=>v.tipo==='Cavalo').map(v=>v.placa)},
    {k:'carreta',label:'Carreta (placa)',type:'select',opts:S.cad.veiculos.filter(v=>v.tipo!=='Cavalo').map(v=>v.placa)}],o=>{
      const id=nextId('ot','OT');S.ots.push(Object.assign({id,tipo:'Retirada de vazio',container:c.num,bookingId:c.bookingId,destino:'Ziran Salvador',status:'Programada',criado:iso(now())},o));log(c.num,`${id} criada – retirada de vazio`);toast(id+' programada');},'Programar OT');}
  if(k==='otTerm'){form('OT de entrega no terminal – '+c.num,[
    {k:'destino',label:'Terminal',req:true,v:b?b.terminal:'TECON Salvador'},{k:'agenda',label:'Janela / agendamento',type:'datetime',req:true,v:iso(Math.min(now()+2*HR,b?new Date(b.deadlineCarga)-2*HR:now()+2*HR))},
    {k:'motorista',label:'Motorista',type:'select',opts:S.cad.motoristas.map(m=>m.nome)},{k:'cavalo',label:'Cavalo (placa)',type:'select',opts:S.cad.veiculos.filter(v=>v.tipo==='Cavalo').map(v=>v.placa)},
    {k:'carreta',label:'Carreta (placa)',type:'select',opts:S.cad.veiculos.filter(v=>v.tipo!=='Cavalo').map(v=>v.placa)}],o=>{
      if(b&&new Date(o.agenda)>new Date(b.deadlineCarga))return {k:'agenda',err:'Agendamento depois do deadline de carga ('+fmtDT(b.deadlineCarga)+')'};
      const id=nextId('ot','OT');S.ots.push(Object.assign({id,tipo:'Entrega no terminal',container:c.num,bookingId:c.bookingId,origem:'Ziran Salvador',status:'Programada',criado:iso(now())},o));log(c.num,`${id} criada – entrega no ${o.destino}`);toast(id+' programada');},'Programar OT');}
  if(k==='progOv'){const lots=S.lotes.filter(l=>l.saldo>0&&(!b||l.cliente===b.exportador));form('Programar ovação – '+c.num,[
    {k:'programado',label:'Início previsto',type:'datetime',req:true,v:iso(now()+HR)},
    {k:'loteId',label:'Carga (lote em armazém)',type:'select',opts:[{v:'',l:'— carga direta do caminhão —'},...lots.map(l=>({v:l.id,l:`${l.id} · ${l.descricao} · saldo ${nf(l.saldo)} vol.`}))]},
    {k:'volumes',label:'Volumes previstos',type:'number'},{k:'conferente',label:'Conferente',v:''}],o=>{
      const id=nextId('ov','OV');S.ops.push(Object.assign({id,tipo:'Ovação',container:c.num,bookingId:c.bookingId,cliente:b?b.exportador:'',peso:null,inicio:null,fim:null,status:'Programada'},o));log(c.num,`${id} – ovação programada`);toast('Ovação '+id+' programada');},'Programar');}
  if(k==='toPS'){form('Posicionar no pré-stacking – '+c.num,[{k:'posicao',label:'Posição (bloco-fila-altura)',req:true,v:sugPos(),help:'Sugestão: primeira posição livre'}],o=>{
      const p=o.posicao.toUpperCase();if(S.containers.some(x=>x.posicao===p&&x.status==='Pré-stacking'))return {k:'posicao',err:'Posição ocupada'};
      c.status='Pré-stacking';c.posicao=p;c.psEntrada=iso(now());log(c.num,'Posicionado no pré-stacking '+p);toast(c.num+' no pré-stacking');},'Confirmar');}
  if(k==='gotoOv'){closeAll();go('ovacao');}
  if(k==='gotoOt'){closeAll();go('transporte');}
}
function sugPos(){for(const bl of BLOCOS)for(let f=1;f<=8;f++)for(let a=1;a<=3;a++){const p=`${bl}-${String(f).padStart(2,'0')}-${a}`;if(!S.containers.some(c=>c.posicao===p&&c.status==='Pré-stacking'))return p;}return '';}
function addContainer(bid){const b=bkById(bid);const livres=S.containers.filter(c=>!c.bookingId&&c.status==='Estoque vazio'&&c.armador===b.armador&&c.tipo===b.tipo);
  form('Vincular contêiner ao booking '+b.booking,[
    {k:'num',label:'Nº do contêiner',req:true,cntr:true,ph:'AAAU1234567',list:livres.map(c=>c.num),help:livres.length?`${livres.length} vazio(s) ${b.armador} ${b.tipo} em estoque aparecem na lista`:'Sem vazios compatíveis em estoque: será criado como “Aguardando retirada”'},
    {k:'tipo',label:'Tipo',type:'select',opts:TIPOS,v:b.tipo},{k:'tara',label:'Tara (kg)',type:'number',v:TARA[b.tipo]}],o=>{
      let c=cByNum(o.num);
      if(c&&c.bookingId)return {k:'num',err:'Contêiner já vinculado ao booking '+(bkById(c.bookingId)||{}).booking};
      if(c){c.bookingId=b.id;c.status='Vazio no pátio';c.tipo=o.tipo;c.tara=o.tara||c.tara;}
      else{S.seq.c++;c={id:'C'+S.seq.c+Math.random().toString(36).slice(2,4),num:o.num,tipo:o.tipo,armador:b.armador,bookingId:b.id,status:'Aguardando retirada',tara:o.tara||TARA[o.tipo],pesoCarga:null,vgm:null,lacre:'',posicao:''};S.containers.push(c);}
      log(c.num,'Vinculado ao booking '+b.booking);toast(c.num+' vinculado');},'Vincular');}

/* ============ CONTÊINERES ============ */
let fC={q:'',st:''};
R.conteineres=()=>{
  const all=[...CST,...CST_IMP];
  const rows=S.containers.filter(c=>(!fC.st||c.status===fC.st)&&(!fC.q||norm(c.num+' '+c.armador+' '+(bkById(c.bookingId)||{}).booking).includes(norm(fC.q))));
  const inv=S.containers.filter(c=>!isoOK(c.num)).length;
  return `<section class="panel"><header><h2>Dados de contêiner</h2>
    <input type="search" id="cq" placeholder="Nº, armador ou booking" value="${H(fC.q)}" style="max-width:220px" aria-label="Filtrar contêineres">
    <select id="cst" style="max-width:210px" aria-label="Status"><option value="">Todos os status</option>${all.map(s=>`<option ${fC.st===s?'selected':''}>${H(s)}</option>`).join('')}</select>
    <button class="btn pri" data-act="novoC">+ Cadastrar contêiner</button></header>
    <div class="pbody small muted" style="padding-block:8px;border-bottom:1px solid var(--line2)">${rows.length} contêineres · VGM = tara + peso da carga (SOLAS) · ${inv?`<span class="bad">${inv} com dígito verificador inválido</span>`:'todos com dígito verificador ISO 6346 válido'}</div>
  <div class="tw"><table><thead><tr><th>Contêiner</th><th>Tipo</th><th>Armador</th><th>Booking / BL</th><th>Status</th><th class="r">Tara kg</th><th class="r">Carga kg</th><th class="r">VGM kg</th><th>Lacre</th><th>Posição</th><th>Gate in</th></tr></thead><tbody>
  ${rows.slice(0,400).map(c=>{const b=bkById(c.bookingId);return `<tr class="click" data-cnum="${c.num}"><td class="mono"><b>${H(c.num)}</b>${isoOK(c.num)?'':' <span class="chip crit">DV</span>'}</td><td>${H(c.tipo)}</td><td>${H(c.armador)}</td><td class="mono small">${H(b?b.booking:(c.bl||'—'))}</td><td>${statusChipC(c.status)}</td><td class="r num">${nf(c.tara)}</td><td class="r num">${nf(c.pesoCarga)}</td><td class="r num">${nf(c.vgm)}</td><td class="mono small">${H(c.lacre||'—')}</td><td class="mono small">${H(c.posicao||'—')}</td><td class="num small">${fmtDT(c.gateIn)}</td></tr>`;}).join('')||`<tr><td colspan="11" class="empty">Nenhum contêiner.</td></tr>`}
  </tbody></table></div>${rows.length>400?`<div class="pbody muted small">Mostrando 400 de ${nf(rows.length)}. Use o filtro para encontrar os demais.</div>`:''}</section>`;
};
function novoC(){form('Cadastrar contêiner',[
  {k:'num',label:'Nº do contêiner',req:true,cntr:true,ph:'AAAU1234567'},{k:'tipo',label:'Tipo',type:'select',opts:TIPOS,v:'40HC'},{k:'armador',label:'Armador',type:'select',opts:S.cad.armadores},
  {k:'status',label:'Situação',type:'select',opts:['Estoque vazio','Cheio (importação)'],v:'Estoque vazio'},{k:'tara',label:'Tara (kg)',type:'number'},{k:'posicao',label:'Posição no pátio'},{k:'bl',label:'BL (importação)'}],o=>{
    if(cByNum(o.num))return {k:'num',err:'Contêiner já cadastrado'};S.seq.c++;
    S.containers.push({id:'C'+S.seq.c+Math.random().toString(36).slice(2,4),num:o.num,tipo:o.tipo,armador:o.armador,bookingId:null,status:o.status,tara:o.tara||TARA[o.tipo],pesoCarga:null,vgm:null,lacre:'',posicao:(o.posicao||'').toUpperCase(),gateIn:iso(now()),bl:o.bl});log(o.num,'Gate In registrado ('+o.status+')');toast(o.num+' cadastrado');},'Cadastrar');}
function cDrawer(num){openDrawer(()=>{const c=cByNum(num);if(!c)return `<header><h2>Não encontrado</h2><button class="btn ghost" data-act="close">✕</button></header>`;const b=bkById(c.bookingId);
  return `<header><div style="flex:1"><div class="muted small">${H(c.armador)} · ${H(c.tipo)}</div><h2 class="mono">${H(c.num)}</h2><div>${statusChipC(c.status)} ${isoOK(c.num)?'<span class="chip ok">ISO 6346 ok</span>':'<span class="chip crit">Dígito verificador inválido</span>'}</div></div>
  <button class="btn" data-act="editC" data-id="${c.id}">Editar dados</button><button class="btn ghost" data-act="close" aria-label="Fechar">✕</button></header>
  <div class="dbody"><section class="panel"><div class="pbody facts">
    <div><small>Booking</small><b class="mono">${b?`<a href="#" data-bk="${b.id}">${H(b.booking)}</a>`:'—'}</b></div><div><small>BL</small><b class="mono">${H(c.bl||'—')}</b></div>
    <div><small>Navio</small><b>${H(b?b.navio+' '+b.viagem:'—')}</b></div><div><small>Deadline carga</small><b>${b?fmtDT(b.deadlineCarga):'—'}</b></div>
    <div><small>Tara</small><b class="num">${nf(c.tara)} kg</b></div><div><small>Peso da carga</small><b class="num">${nf(c.pesoCarga)} kg</b></div><div><small>VGM</small><b class="num">${nf(c.vgm)} kg</b></div>
    <div><small>Lacre</small><b class="mono">${H(c.lacre||'—')}</b></div><div><small>Posição</small><b class="mono">${H(c.posicao||'—')}</b></div><div><small>Gate in</small><b>${fmtDT(c.gateIn)}</b></div>
  </div></section>
  <section class="panel"><header><h2>Histórico do contêiner</h2></header><div class="pbody timeline">${histFor([c.num])}</div></section></div>`;});}
function editC(id){const c=S.containers.find(x=>x.id===id);form('Editar '+c.num,[
  {k:'status',label:'Status',type:'select',opts:[...CST,...CST_IMP],v:c.status},{k:'tara',label:'Tara (kg)',type:'number',v:c.tara},{k:'pesoCarga',label:'Peso da carga (kg)',type:'number',v:c.pesoCarga},
  {k:'lacre',label:'Lacre',v:c.lacre},{k:'posicao',label:'Posição',v:c.posicao},{k:'obs',label:'Observação',type:'textarea',full:true,v:c.obs}],o=>{
    const old=c.status;Object.assign(c,o);c.posicao=(c.posicao||'').toUpperCase();c.vgm=c.pesoCarga!=null&&c.tara?c.tara+c.pesoCarga:null;log(c.num,old!==c.status?`Status alterado: ${old} → ${c.status}`:'Dados atualizados');toast('Contêiner atualizado');});}

/* ============ TRANSPORTE ============ */
R.transporte=()=>{
  const col=st=>{const L=S.ots.filter(o=>o.status===st).sort((a,b)=>new Date(a.agenda)-new Date(b.agenda));
    return `<div class="col"><h3><span>${st}</span><span>${L.length}</span></h3><div class="cards">${L.map(o=>{const b=bkById(o.bookingId);const late=st==='Programada'&&new Date(o.agenda)<now();
      const risk=b&&o.tipo==='Entrega no terminal'&&st!=='Concluída'?urg(b.deadlineCarga,true):null;
      return `<div class="card"><div class="t"><b class="mono">${H(o.id)}</b><span class="tag">${H(o.tipo)}</span></div>
      ${o.container?`<div class="mono"><a href="#" data-cnum="${H(o.container)}">${H(o.container)}</a>${b?` <span class="muted small">· ${H(b.booking)}</span>`:''}</div>`:''}
      <div class="route">${H(o.origem)} → <b>${H(o.destino)}</b></div>
      <div class="meta">${fmtDT(o.agenda)} ${late?'<span class="bad">· atrasada</span>':''} · ${H(o.motorista||'sem motorista')} · <span class="mono">${H(o.cavalo||'')}${o.carreta?' / '+H(o.carreta):''}</span></div>
      ${risk&&risk!=='ok'?`<div>${dlChip(b.deadlineCarga,true)} <span class="small muted">deadline de carga</span></div>`:''}
      ${st!=='Concluída'?`<div class="row"><button class="btn sm pri" data-ot="${o.id}" data-to="${st==='Programada'?'Em rota':'Concluída'}">${st==='Programada'?'Iniciar viagem':'Concluir entrega'}</button></div>`:`<div class="meta">Concluída ${fmtDT(o.fim||o.agenda)}</div>`}
      </div>`;}).join('')||'<div class="muted small" style="padding:6px">Nenhuma OT.</div>'}</div></div>`;};
  return `<div class="row"><span class="muted">Ordens de transporte (OT) de contêineres e carga solta. Retirada de vazio e entrega no terminal atualizam o status do contêiner.</span><span class="spacer"></span><button class="btn pri" data-act="novaOT">+ Nova OT</button></div>
  <div class="kan">${col('Programada')}${col('Em rota')}${col('Concluída')}</div>`;
};
function novaOT(){form('Nova ordem de transporte',[
  {k:'tipo',label:'Tipo',type:'select',opts:OT_TIPOS},{k:'container',label:'Contêiner (se houver)',ph:'AAAU1234567',list:S.containers.map(c=>c.num)},
  {k:'origem',label:'Origem',req:true,v:'Ziran Salvador'},{k:'destino',label:'Destino',req:true},{k:'agenda',label:'Agendamento',type:'datetime',req:true,v:iso(now()+2*HR)},
  {k:'motorista',label:'Motorista',type:'select',opts:S.cad.motoristas.map(m=>m.nome)},{k:'cavalo',label:'Cavalo',type:'select',opts:S.cad.veiculos.filter(v=>v.tipo==='Cavalo').map(v=>v.placa)},
  {k:'carreta',label:'Carreta',type:'select',opts:S.cad.veiculos.filter(v=>v.tipo!=='Cavalo').map(v=>v.placa)}],o=>{
    if(o.container){o.container=cleanC(o.container);if(!isoOK(o.container))return {k:'container',err:'Número inválido (dígito verificador ISO 6346)'};}
    const c=o.container&&cByNum(o.container);const id=nextId('ot','OT');S.ots.push(Object.assign({id,bookingId:c?c.bookingId:null,status:'Programada',criado:iso(now())},o));if(o.container)log(o.container,`${id} criada – ${o.tipo}`);toast(id+' programada');},'Programar OT');}
function moveOT(id,to){const o=S.ots.find(x=>x.id===id);const c=o.container&&cByNum(o.container);o.status=to;if(to==='Concluída')o.fim=iso(now());
  if(c){if(o.tipo==='Retirada de vazio'&&to==='Concluída'){c.status='Vazio no pátio';c.gateIn=iso(now());log(c.num,'Gate In – vazio recebido ('+id+')');}
    else if(o.tipo==='Entrega no terminal'){if(to==='Em rota'){c.status='Em trânsito p/ terminal';c.posicao='';log(c.num,`Saiu para ${o.destino} (${id})`);}else{c.status='Entregue no terminal';c.entregueAt=iso(now());log(c.num,`Entregue no ${o.destino} (${id})`);}}
    else if(o.tipo==='Devolução de vazio'&&to==='Concluída'){c.status='Devolvido ao armador';c.posicao='';log(c.num,'Devolvido ao armador ('+id+')');}
    else log(c.num,`${id} – ${to}`);}
  toast(`${id}: ${to}`);refresh();}

/* ============ OVAÇÃO / DESOVA ============ */
let tabOv='abertas';
R.ovacao=()=>{
  const L=S.ops.filter(o=>tabOv==='abertas'?o.status!=='Concluída':o.status==='Concluída').sort((a,b)=>new Date(a.inicio||a.programado)-new Date(b.inicio||b.programado));
  return `<section class="panel"><header><h2>Ordens de ovação e desova</h2><button class="btn" data-act="novaDes">+ Programar desova</button><button class="btn pri" data-act="novaOvLivre">+ Programar ovação</button></header>
  <div class="pbody" style="padding-block:0"><div class="tabs"><button class="${tabOv==='abertas'?'on':''}" data-tabov="abertas">Abertas (${S.ops.filter(o=>o.status!=='Concluída').length})</button><button class="${tabOv==='concl'?'on':''}" data-tabov="concl">Concluídas</button></div></div>
  <div class="tw"><table><thead><tr><th>Ordem</th><th>Tipo</th><th>Contêiner</th><th>Booking / BL</th><th>Cliente</th><th>Carga / lote</th><th class="r">Volumes</th><th class="r">Peso kg</th><th>Programado</th><th>Tempo</th><th>Status</th><th></th></tr></thead><tbody>
  ${L.map(o=>{const b=bkById(o.bookingId),l=loteById(o.loteId);const t=o.inicio?(o.fim?dur(new Date(o.fim)-new Date(o.inicio)):dur(now()-new Date(o.inicio))+' em curso'):'—';
    const dl=b&&o.status!=='Concluída'?dlChip(b.deadlineCarga,true):'';
    return `<tr><td class="mono"><b>${H(o.id)}</b></td><td><span class="tag">${H(o.tipo)}</span></td><td class="mono"><a href="#" data-cnum="${H(o.container)}">${H(o.container)}</a></td><td class="mono small">${H(b?b.booking:(o.bl||'—'))}<div>${dl}</div></td><td>${H(o.cliente)}</td><td class="small">${l?H(l.id+' · '+l.descricao):'<span class="muted">—</span>'}</td><td class="r num">${nf(o.volumes)}</td><td class="r num">${nf(o.peso)}</td><td class="num small">${fmtDT(o.programado)}</td><td class="small">${t}<div class="muted">${H(o.conferente||'')}</div></td><td>${chipOT(o.status)}</td>
    <td>${o.status==='Programada'?`<button class="btn sm pri" data-op="${o.id}" data-opto="start">Iniciar</button>`:o.status==='Em andamento'?`<button class="btn sm pri" data-op="${o.id}" data-opto="end">Concluir</button>`:''}</td></tr>`;}).join('')||`<tr><td colspan="12" class="empty">Nenhuma ordem.</td></tr>`}
  </tbody></table></div></section>
  <p class="muted small">Concluir uma ovação registra lacre e peso, calcula o VGM e baixa o saldo do lote no armazém. Concluir uma desova cria o lote da carga no armazém e libera o contêiner vazio.</p>`;
};
function opStart(id){const o=S.ops.find(x=>x.id===id);form(`Iniciar ${o.tipo.toLowerCase()} ${o.id}`,[{k:'conferente',label:'Conferente',req:true,v:o.conferente},{k:'doca',label:'Doca / local',v:'Doca 1'}],v=>{
  o.status='Em andamento';o.inicio=iso(now());o.conferente=v.conferente;const c=cByNum(o.container);if(c){c.status=o.tipo==='Ovação'?'Em ovação':'Em desova';c.posicao=v.doca;log(c.num,`${o.tipo} iniciada (${o.id}) – ${v.doca}`);}toast(o.tipo+' iniciada');},'Iniciar');}
function opEnd(id){const o=S.ops.find(x=>x.id===id);const c=cByNum(o.container);
  if(o.tipo==='Ovação'){const l=loteById(o.loteId);form(`Concluir ovação ${o.id} – ${o.container}`,[
    {k:'volumes',label:'Volumes ovados',type:'number',req:true,v:o.volumes},{k:'peso',label:'Peso da carga (kg)',type:'number',req:true,v:l&&o.volumes?Math.round(l.peso/l.volumes*o.volumes):null,help:l?`Lote ${l.id}: ${nf(l.peso/l.volumes,1)} kg por volume`:''},
    {k:'lacre',label:'Lacre do armador',req:true},{k:'fotos',label:'Fotos (qtd.)',type:'number',v:6,help:'No sistema final: upload das fotos da ovação'}],v=>{
      if(l&&v.volumes>l.saldo)return {k:'volumes',err:`Saldo do lote ${l.id} é ${nf(l.saldo)} volumes`};
      o.status='Concluída';o.fim=iso(now());o.volumes=v.volumes;o.peso=v.peso;o.lacre=v.lacre;
      if(l){l.saldo-=v.volumes;if(l.saldo<=0){l.saldo=0;l.saida=iso(now());}}
      if(c){c.status='Ovado';c.pesoCarga=v.peso;c.vgm=c.tara+v.peso;c.lacre=v.lacre;c.posicao='';log(c.num,`Ovação concluída – lacre ${v.lacre}, VGM ${nf(c.vgm)} kg`);}
      toast('Ovação concluída · VGM '+nf(c?c.vgm:0)+' kg');},'Concluir ovação');}
  else{form(`Concluir desova ${o.id} – ${o.container}`,[
    {k:'descricao',label:'Descrição da carga',req:true,full:true},{k:'embalagem',label:'Embalagem',type:'select',opts:['Palete','Caixa','Sacaria','Big bag','Bobina','Fardo','Tambor','Outros']},
    {k:'volumes',label:'Volumes',type:'number',req:true},{k:'peso',label:'Peso (kg)',type:'number',req:true},{k:'m3',label:'Cubagem (m³)',type:'number',req:true},
    {k:'area',label:'Área',type:'select',opts:AREAS.map(a=>({v:a.id,l:a.nome}))},{k:'posicao',label:'Posição (rua-quadra)',req:true},{k:'freeTime',label:'Free time (dias)',type:'number',v:7},{k:'avaria',label:'Avarias / ressalvas',type:'textarea',full:true}],v=>{
      const lid=nextId('lote','L');S.lotes.push({id:lid,cliente:o.cliente,nf:'—',descricao:v.descricao,embalagem:v.embalagem,volumes:v.volumes,saldo:v.volumes,peso:v.peso,m3:v.m3,area:v.area,posicao:v.posicao.toUpperCase(),entrada:iso(now()),freeTime:v.freeTime||7,bookingId:null,origem:'Desova '+o.container,avaria:v.avaria});
      o.status='Concluída';o.fim=iso(now());o.volumes=v.volumes;o.peso=v.peso;o.loteId=lid;
      if(c){c.status='Vazio pós-desova';c.posicao='';log(c.num,`Desova concluída – carga no lote ${lid}`);}toast('Desova concluída · lote '+lid+' criado');},'Concluir desova');}}
function novaDes(){const cands=S.containers.filter(c=>c.status==='Cheio (importação)'&&!S.ops.some(o=>o.container===c.num&&o.status!=='Concluída'));form('Programar desova',[
  {k:'container',label:'Contêiner cheio',req:true,cntr:true,list:cands.map(c=>c.num),v:cands[0]?cands[0].num:''},{k:'bl',label:'BL',v:cands[0]?cands[0].bl:''},{k:'cliente',label:'Cliente / importador',req:true,list:S.cad.clientes},
  {k:'programado',label:'Início previsto',type:'datetime',req:true,v:iso(now()+2*HR)},{k:'conferente',label:'Conferente'}],o=>{
    if(!cByNum(o.container))return {k:'container',err:'Contêiner não cadastrado: cadastre em Contêineres ou importe do SISTER'};
    const id=nextId('ds','DS');S.ops.push(Object.assign({id,tipo:'Desova',bookingId:null,loteId:null,volumes:null,peso:null,inicio:null,fim:null,status:'Programada'},o));log(o.container,id+' – desova programada');toast('Desova '+id+' programada');},'Programar');}
function novaOvLivre(){const cands=S.containers.filter(c=>c.bookingId&&c.status==='Vazio no pátio'&&!S.ops.some(o=>o.container===c.num&&o.status!=='Concluída'));
  if(!cands.length){toast('Nenhum vazio vinculado a booking disponível para ovação');return;}
  form('Programar ovação',[{k:'c',label:'Contêiner vazio (vinculado a booking)',type:'select',opts:cands.map(c=>({v:c.id,l:c.num+' · '+bkById(c.bookingId).booking}))}],o=>{setTimeout(()=>cAction('progOv',o.c),0);},'Continuar');}

/* ============ PRÉ-STACKING ============ */
R.prestacking=()=>{
  const ps=S.containers.filter(c=>['Ovado','Pré-stacking','Em trânsito p/ terminal'].includes(c.status));
  const navios=[...new Set(S.bookings.map(b=>b.navio))];
  const pal=['#D6001C','#3A3A3A','#8C8E8E','#2D5F9A','#B7791F','#1F7A48','#7A3E9D'];
  const colorN=n=>pal[navios.indexOf(n)%pal.length];
  const byN={};ps.forEach(c=>{const b=bkById(c.bookingId);const k=b?b.navio:'Sem booking';(byN[k]=byN[k]||[]).push(c);});
  const teu=ps.filter(c=>c.status==='Pré-stacking').reduce((a,c)=>a+TEU(c.tipo),0);
  const cap=BLOCOS.length*8*3*2;
  const blk=bl=>{let bays='';for(let f=1;f<=8;f++){let sl='';for(let a=1;a<=3;a++){const p=`${bl}-${String(f).padStart(2,'0')}-${a}`;const c=S.containers.find(x=>x.posicao===p&&x.status==='Pré-stacking');const b=c&&bkById(c.bookingId);
      sl+=c?`<div class="slot f" style="background:${colorN(b?b.navio:'')}" title="${H(p+' · '+c.num+' · '+(b?b.navio:''))}" data-cnum="${c.num}"></div>`:`<div class="slot" title="${p} livre"></div>`;}
    bays+=`<div class="bay">${sl}<div class="bayn">${String(f).padStart(2,'0')}</div></div>`;}
    const n=S.containers.filter(c=>c.status==='Pré-stacking'&&(c.posicao||'').startsWith(bl+'-')).length;
    return `<div class="blk"><h4><span>Bloco ${bl}</span><span class="small muted num">${n}/24</span></h4><div class="bays">${bays}</div></div>`;};
  return `<section class="kpis">
    <div class="kpi"><span class="l">Ocupação do pré-stacking</span><span class="v">${nf(teu/cap*100)}%</span><span class="s">${teu} de ${cap} TEU (4 blocos × 8 filas × 3 alturas)</span></div>
    <div class="kpi"><span class="l">Aguardando posição</span><span class="v">${ps.filter(c=>c.status==='Ovado').length}</span><span class="s">ovados ainda na doca</span></div>
    <div class="kpi"><span class="l">Em trânsito p/ terminal</span><span class="v">${ps.filter(c=>c.status==='Em trânsito p/ terminal').length}</span><span class="s">OT em rota</span></div>
  </section>
  <section class="panel"><header><h2>Mapa do pré-stacking</h2><div class="legend">${navios.map(n=>`<span><i style="background:${colorN(n)}"></i>${H(n)}</span>`).join('')}</div></header><div class="pbody yard">${BLOCOS.map(blk).join('')}</div>
  <div class="pbody small muted" style="padding-top:0">Posição no formato bloco-fila-altura (ex.: B1-02-1). Clique num contêiner para ver os dados.</div></section>
  ${Object.entries(byN).map(([n,L])=>{const b=bkById(L[0].bookingId);return `<section class="panel"><header><h2>${H(n)} ${b?`<span class="muted">${H(b.viagem)}</span>`:''}</h2>${b?`<span class="hint">Deadline de carga ${fmtDT(b.deadlineCarga)}</span>${dlChip(b.deadlineCarga,true)}`:''}</header>
  <div class="tw"><table><thead><tr><th>Contêiner</th><th>Booking</th><th>Tipo</th><th>Status</th><th>Posição</th><th class="r">VGM kg</th><th>Lacre</th><th>No pré-stacking há</th><th></th></tr></thead><tbody>
  ${L.map(c=>{const bb=bkById(c.bookingId);const hasOT=S.ots.some(o=>o.container===c.num&&o.status!=='Concluída');return `<tr><td class="mono"><a href="#" data-cnum="${c.num}">${H(c.num)}</a></td><td class="mono small">${H(bb?bb.booking:'—')}</td><td>${H(c.tipo)}</td><td>${statusChipC(c.status)}</td><td class="mono">${H(c.posicao||'—')}</td><td class="r num">${nf(c.vgm)}</td><td class="mono small">${H(c.lacre)}</td><td class="small">${c.psEntrada&&c.status==='Pré-stacking'?dur(now()-new Date(c.psEntrada)):'—'}</td>
   <td>${c.status==='Ovado'?`<button class="btn sm pri" data-cact="toPS" data-c="${c.id}">Posicionar</button>`:c.status==='Pré-stacking'&&!hasOT?`<button class="btn sm pri" data-cact="otTerm" data-c="${c.id}">Gerar OT p/ terminal</button>`:hasOT?'<span class="small muted">OT aberta</span>':''}</td></tr>`;}).join('')}
  </tbody></table></div></section>`;}).join('')}`;
};

/* ============ ARMAZENAGEM ============ */
const diasArm=l=>Math.floor(((l.saida&&l.saldo<=0?new Date(l.saida):now())-new Date(l.entrada))/DAY);
let tabArm='estoque';
R.armazenagem=()=>{
  const occ=AREAS.map(a=>{const u=S.lotes.filter(l=>l.area===a.id&&l.saldo>0).reduce((s,l)=>s+l.m3*(l.saldo/l.volumes),0);return {a,u,p:u/a.cap};});
  const L=S.lotes.filter(l=>tabArm==='estoque'?l.saldo>0:l.saldo<=0).sort((a,b)=>new Date(a.entrada)-new Date(b.entrada));
  return `<section class="kpis">${occ.map(o=>`<div class="kpi" style="cursor:default"><span class="l">${H(o.a.nome)}</span><span class="v">${nf(o.p*100)}%</span><div class="bar ${o.p>.85?'crit':o.p>.7?'warn':''}"><i style="width:${Math.min(100,o.p*100)}%"></i></div><span class="s">${nf(o.u)} de ${nf(o.a.cap)} m³ ocupados</span></div>`).join('')}</section>
  <section class="panel"><header><h2>Lotes de carga</h2><button class="btn pri" data-act="novoLote">+ Entrada de carga</button></header>
  <div class="pbody" style="padding-block:0"><div class="tabs"><button class="${tabArm==='estoque'?'on':''}" data-tabarm="estoque">Em estoque (${S.lotes.filter(l=>l.saldo>0).length})</button><button class="${tabArm==='baixados'?'on':''}" data-tabarm="baixados">Baixados</button></div></div>
  <div class="tw"><table><thead><tr><th>Lote</th><th>Cliente</th><th>NF</th><th>Descrição</th><th class="r">Volumes</th><th class="r">Saldo</th><th class="r">Peso kg</th><th class="r">m³</th><th>Área / posição</th><th>Entrada</th><th>Armazenagem</th><th>Vínculo</th><th></th></tr></thead><tbody>
  ${L.map(l=>{const d=diasArm(l),exc=d-l.freeTime;const b=bkById(l.bookingId);const a=AREAS.find(x=>x.id===l.area);
   return `<tr><td class="mono"><b>${H(l.id)}</b></td><td>${H(l.cliente)}</td><td class="mono small">${H(l.nf)}</td><td>${H(l.descricao)}<div class="muted small">${H(l.embalagem)} · ${H(l.origem||'')}</div></td><td class="r num">${nf(l.volumes)}</td><td class="r num"><b>${nf(l.saldo)}</b></td><td class="r num">${nf(l.peso)}</td><td class="r num">${nf(l.m3)}</td><td>${H(a?a.nome:l.area)}<div class="mono small">${H(l.posicao)}</div></td><td class="num small">${fmtD(l.entrada)}</td>
   <td><span class="chip ${exc>0?'crit':exc>-2?'warn':'ok'}">${d} dia${d===1?'':'s'}</span><div class="small ${exc>0?'bad':'muted'}">${exc>0?`${exc} além do free time (${l.freeTime}d)`:`free time ${l.freeTime}d`}</div></td>
   <td class="mono small">${b?H(b.booking):'—'}</td><td>${l.saldo>0?`<button class="btn sm" data-saida="${l.id}">Registrar saída</button>`:''}</td></tr>`;}).join('')||`<tr><td colspan="13" class="empty">Nenhum lote.</td></tr>`}
  </tbody></table></div></section>
  <p class="muted small">Armazenagem conta dias corridos desde a entrada; acima do free time do cliente o lote fica em vermelho para cobrança. Saídas por ovação baixam o saldo automaticamente.</p>`;
};
function novoLote(){form('Entrada de carga no armazém',[
  {k:'cliente',label:'Cliente',req:true,list:S.cad.clientes},{k:'nf',label:'Nota fiscal',req:true},{k:'descricao',label:'Descrição da carga',req:true,full:true},
  {k:'embalagem',label:'Embalagem',type:'select',opts:['Palete','Caixa','Sacaria','Big bag','Bobina','Fardo','Tambor','Outros']},{k:'volumes',label:'Volumes',type:'number',req:true},{k:'peso',label:'Peso (kg)',type:'number',req:true},{k:'m3',label:'Cubagem (m³)',type:'number',req:true},
  {k:'area',label:'Área',type:'select',opts:AREAS.map(a=>({v:a.id,l:a.nome}))},{k:'posicao',label:'Posição (rua-quadra)',req:true},{k:'freeTime',label:'Free time (dias)',type:'number',v:10},
  {k:'bookingId',label:'Booking de exportação (opcional)',type:'select',opts:[{v:'',l:'— nenhum —'},...S.bookings.map(b=>({v:b.id,l:b.booking+' · '+b.exportador}))]}],o=>{
    if(o.volumes<=0)return {k:'volumes',err:'Informe a quantidade de volumes'};
    const id=nextId('lote','L');S.lotes.push(Object.assign({id,saldo:o.volumes,entrada:iso(now()),origem:'Entrada manual'},o,{posicao:o.posicao.toUpperCase(),bookingId:o.bookingId||null,freeTime:o.freeTime||10}));
    if(!S.cad.clientes.includes(o.cliente))S.cad.clientes.push(o.cliente);log(id,'Entrada no armazém');toast('Lote '+id+' registrado');},'Registrar entrada');}
function saidaLote(id){const l=loteById(id);form('Saída do lote '+l.id,[{k:'volumes',label:`Volumes (saldo ${nf(l.saldo)})`,type:'number',req:true,v:l.saldo},{k:'destino',label:'Destino / motivo',req:true,v:'Retirada pelo cliente'}],o=>{
  if(o.volumes>l.saldo||o.volumes<=0)return {k:'volumes',err:'Quantidade maior que o saldo'};l.saldo-=o.volumes;if(l.saldo<=0){l.saldo=0;l.saida=iso(now());}log(l.id,`Saída de ${o.volumes} volumes – ${o.destino}`);toast('Saída registrada');},'Registrar saída');}

/* ============ IMPORTAR ============ */
const MAP_BK={booking:['booking','booking number','bkg','reserva','n booking','numero booking'],armador:['armador','carrier','shipping line','linha','cli'],navio:['navio','vessel','embarcacao','vessel name'],viagem:['viagem','voyage','viag','voy'],
  destino:['destino','pod','porto destino','porto de destino','port of discharge','porto descarga'],exportador:['exportador','shipper','cliente','embarcador'],qtd:['qtd','qtde','quantidade','qty','quantity'],tipo:['tipo','type','equipamento','iso','tipo cntr'],
  deadlineDraft:['deadline draft','deadline de draft','dl draft','draft deadline','deadline documental','si cut off','draft'],deadlineCarga:['deadline carga','deadline de carga','dl carga','cargo deadline','cut off carga','deadline fisico','cy cut off','cut off'],ets:['ets','etd','saida navio','previsao de saida']};
const MAP_SI={num:['container','conteiner','cntr','unidade','container number','n container'],tipo:['tipo','iso','tipo iso','type'],tara:['tara','tare'],armador:['cli','armador','cliente','linha','owner'],
  gateIn:['entrada','gate in','data entrada','dt entrada','dt gate in'],gateOut:['saida','gate out','data saida','dt saida'],booking:['booking','reserva'],status:['st e','status','situacao','condicao','estado'],posicao:['posicao','pos','localizacao','local']};
function mapHeaders(hdr,M){const res={},used=new Set();
  const cands=[];hdr.forEach((h,i)=>{const n=norm(h);if(!n)return;Object.entries(M).forEach(([k,syn])=>syn.forEach(s=>{if(n===s)cands.push({i,k,sc:100+s.length});else if(n.includes(s)&&s.length>=3)cands.push({i,k,sc:s.length});}));});
  cands.sort((a,b)=>b.sc-a.sc).forEach(c=>{if(res[c.k]==null&&!used.has(c.i)){res[c.k]=c.i;used.add(c.i);}});return res;}
function findHeaderRow(rows,M){let best=-1,bs=0;for(let r=0;r<Math.min(rows.length,40);r++){const m=mapHeaders(rows[r].map(String),M);const s=Object.keys(m).length;if(s>bs){bs=s;best=r;}}return bs>=2?best:-1;}
const ARM_ALIAS={cma:'CMA CGM','cma cgm':'CMA CGM',msc:'MSC',msk:'Maersk',maersk:'Maersk',mae:'Maersk',csl:'COSCO',cosco:'COSCO',hpl:'Hapag-Lloyd','hapag lloyd':'Hapag-Lloyd',hapag:'Hapag-Lloyd'};
const armNorm=a=>ARM_ALIAS[norm(a)]||String(a||'').trim();
const TIPO_ALIAS={'22G1':'20DV','22U1':'20OT','42G1':'40DV','45G1':'40HC','45R1':'40RH','22R1':'20RF','42U1':'20OT','45P3':'40FR','20DC':'20DV','40DC':'40DV','40HQ':'40HC','40RF':'40RH','40HR':'40RH'};
const tipoNorm=t=>{const x=String(t||'').toUpperCase().replace(/\s/g,'');return TIPO_ALIAS[x]||(TIPOS.includes(x)?x:(x.includes('40')&&(x.includes('HC')||x.includes('HQ'))?'40HC':x||'40HC'));};
const toDate=v=>{if(v==null||v==='')return null;if(v instanceof Date)return isNaN(v)?null:iso(v);if(typeof v==='number'&&window.XLSX){const d=XLSX.SSF.parse_date_code(v);if(d)return iso(new Date(d.y,d.m-1,d.d,d.H,d.M,d.S));}
  const m=String(v).match(/(\d{1,2})\/(\d{1,2})\/(\d{2,4})(?:\s+(\d{1,2}):(\d{2}))?/);if(m){const y=+m[3]<100?2000+ +m[3]:+m[3];return iso(new Date(y,m[2]-1,m[1],m[4]||0,m[5]||0));}const d=new Date(v);return isNaN(d)?null:iso(d);};
let imp={kind:null,name:'',rows:[],map:{},hdr:[],parsed:[]};
R.importar=()=>{
  const box=(k,t,d,cols)=>`<section class="panel"><header><h2>${t}</h2></header><div class="pbody" style="display:flex;flex-direction:column;gap:12px">
    <p class="muted" style="margin:0">${d}</p>
    <label class="drop" data-drop="${k}" for="file_${k}"><b>Arraste o arquivo aqui ou clique para escolher</b><span class="muted small">.xls, .xlsx ou .csv</span><input type="file" id="file_${k}" accept=".xls,.xlsx,.csv" data-file="${k}" hidden></label>
    <div class="cols-ex">Colunas reconhecidas: ${cols}</div></div></section>`;
  let prev='';

/* Histórico simulado (90 dias) — gerado de forma determinística para o protótipo */
function rng(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
let HIST=null;
function genHist(){
  const r=rng(1329),day0=Math.floor(now()/DAY)*DAY;
  const pick=(arr,w)=>{if(!w)return arr[Math.floor(r()*arr.length)];let x=r()*w.reduce((a,b)=>a+b,0);for(let i=0;i<arr.length;i++){x-=w[i];if(x<=0)return arr[i];}return arr[arr.length-1];};
  const nrm=(m,s)=>{let u=0,v=0;while(!u)u=r();while(!v)v=r();return m+s*Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*v);};
  const ARMW=[45,20,15,12,8];
  const EXP=[{n:'Cacau Sul Exportadora',e:'Sacaria',q:.9},{n:'Resinas Camaçari S.A.',e:'Big bag',q:.97},{n:'Papel Baiano Ltda',e:'Bobina',q:.95},{n:'Sisal Nordeste Ind.',e:'Fardo',q:.82},{n:'Frutas do Vale S.F.',e:'Palete',q:.93},{n:'Café Chapada Diamantina',e:'Sacaria',q:.88},{n:'Granitos Sul-Baiano',e:'Caixa',q:.96},{n:'Couros Bahia Ltda',e:'Palete',q:.91}];
  const EXPW=[22,18,14,10,6,12,10,8];
  const DUR={Sacaria:3.3,'Big bag':1.4,Bobina:1.9,Fardo:2.7,Palete:1.7,Caixa:2.9};
  const CONF=[{n:'Edvaldo',f:.92},{n:'Joilson',f:1.0},{n:'Marcos Paulo',f:1.12},{n:'Rita',f:.97}];
  const MOT=['José Carlos Santana','Marcos Vinícius Reis','Antônio Bispo','Rafael Nascimento','Cleiton Souza'];
  const MOTF={'José Carlos Santana':.6,'Marcos Vinícius Reis':1,'Antônio Bispo':.8,'Rafael Nascimento':1.1,'Cleiton Souza':1.9};
  const IMP=['Autopeças Recôncavo','Distribuidora Baía Norte','Têxtil Feira de Santana','Eletro Lauro de Freitas'];
  const bks=[],cnts=[],ots=[],ops=[],occ=[],inv=[];
  const mkOT=(tipo,agenda,base,sd)=>{const mot=pick(MOT);const late=r()<0.07*MOTF[mot];const delay=late?30+Math.abs(nrm(40,35)):nrm(-4,11);
    const inFull=r()>0.018;ots.push({tipo,mot,agenda,delay:Math.round(delay),dur:Math.max(25,Math.round(nrm(base,sd))),tat:Math.max(18,Math.round(nrm(47,16)+(r()<.08?45:0))),inFull,onTime:delay<=30});};
  for(let d=89;d>=0;d--){
    const dStart=day0-d*DAY;
    const nb=r()<.35?2:(r()<.8?1:0);
    for(let k=0;k<nb;k++){
      const armador=pick(ARM,ARMW),ex=pick(EXP,EXPW),tipo=pick(['40HC','40DV','20DV','40RH'],[50,20,25,5]),qtd=1+Math.floor(r()*5);
      const dc=dStart+(14+Math.floor(r()*8))*HR,dd=dc-24*HR;
      const draftLate=r()>ex.q+0.03,vgmLate=r()<(1-ex.q)*0.6;
      const b={armador,exp:ex.n,tipo,qtd,dc,dd,draftAt:draftLate?dd+(1+r()*10)*HR:dd-(2+r()*40)*HR,vgmLate,teu:TEU(tipo)*qtd,rolados:0,antecedencia:[]};
      for(let i=0;i<qtd;i++){
        const late=r()<0.028;const ent=late?dc+(1+r()*8)*HR:dc-(2+r()*36)*HR;
        const dwell=Math.max(4,nrm(34,18)+(r()<.12?40:0));const ps=ent-dwell*HR;
        const conf=pick(CONF);const dur=Math.max(.6,DUR[ex.e]*conf.f*(0.85+r()*.35));
        cnts.push({armador,exp:ex.n,tipo,late,ent,dwell,rolado:late&&r()<.55,dc});
        if(late&&cnts[cnts.length-1].rolado)b.rolados++;
        b.antecedencia.push((dc-ent)/HR);
        ops.push({tipo:'Ovação',t:ps-dur*HR,cliente:ex.n,emb:ex.e,conf:conf.n,dur,vol:Math.round(ex.e==='Big bag'?22:ex.e==='Bobina'?36:ex.e==='Sacaria'?400:ex.e==='Fardo'?160:ex.e==='Caixa'?900:22),m3:TEU(tipo)*28*(.75+r()*.2),avaria:r()<0.012,armador});
        mkOT('Retirada de vazio',ps-dur*HR-(3+r()*20)*HR,95,30);
        mkOT('Entrega no terminal',ent-HR,72,22);
      }
      mkOT('Coleta de carga no cliente',dd-(10+r()*30)*HR,150,45);
      bks.push(b);
    }
    const nd=r()<.55?(r()<.3?2:1):0;
    for(let k=0;k<nd;k++){const emb=pick(['Palete','Caixa','Palete','Caixa','Big bag']);const conf=pick(CONF);const dur=Math.max(.6,DUR[emb]*conf.f*(0.8+r()*.4));const cl=pick(IMP);
      ops.push({tipo:'Desova',t:dStart+(8+r()*8)*HR,cliente:cl,emb,conf:conf.n,dur,vol:emb==='Caixa'?600:30,m3:30+r()*40,avaria:r()<0.015,armador:pick(ARM,ARMW)});
      mkOT('Devolução de vazio',dStart+(14+r()*20)*HR,85,25);}
    AREAS.forEach((a,i)=>{const base=[.72,.61,.54][i];occ.push({t:dStart,area:a.id,p:Math.min(.97,Math.max(.25,base+.12*Math.sin((d+i*9)/9)+nrm(0,.03)))});});
  }
  [[60,98.4],[30,99.1],[0,99.4]].forEach(([d,v])=>inv.push({t:day0-d*DAY,acc:v+nrm(0,.15),itens:180+Math.floor(r()*60)}));
  return {bks,cnts,ots:ots.filter(o=>o.agenda<=now()),ops:ops.filter(o=>o.t<=now()),occ,inv};
}

const pct=(a,b)=>b?a/b:null;
const fP=v=>v==null?'—':nf(v*100,1)+'%';
const avg=a=>a.length?a.reduce((x,y)=>x+y,0)/a.length:null;
function weeks(){const W=Math.ceil(rep.per/7),e=now(),out=[];for(let i=W-1;i>=0;i--){const b=e-(i+1)*7*DAY,t=e-i*7*DAY;out.push({b,t,l:new Date(t).toLocaleDateString('pt-BR',{day:'2-digit',month:'2-digit'})});}return out;}

function colChart(labels,series,o={}){

  let tl='';if(o.target!=null){tl=`<line x1="${L}" x2="${W-Rr}" y1="${y(o.target)}" y2="${y(o.target)}" class="tgt"/><text x="${W-Rr}" y="${y(o.target)-5}" text-anchor="end" class="tgtl">meta ${o.pct?fP(o.target):nf(o.target)}</text>`;}

  return `<div class="chart"><svg viewBox="0 0 ${W} ${CH}" role="img" aria-label="${H(o.title||'Gráfico')}">${g}${bars}${tl}${xl}</svg>${leg}</div>`;}
function hbars(rows,o={}){const mx=o.max||Math.max(...rows.map(r=>r.v),0)||1;return `<div class="hb">${rows.map(r=>`<div class="hbr"><span class="hbl">${H(r.l)}</span><span class="hbt"><i style="width:${Math.max(0,Math.min(100,r.v/mx*100))}%;background:${r.c||'var(--accent)'}"></i></span><span class="hbv num">${o.pct?fP(r.v):nf(r.v,o.d||0)}${r.x?` <span class="muted small">${H(r.x)}</span>`:''}</span></div>`).join('')}</div>`;}

function repData(){
  if(!HIST)HIST=genHist();
  const bks=HIST.bks.filter(b=>inPer(b.dc)&&armOK(b.armador)),cnts=HIST.cnts.filter(c=>inPer(c.ent)&&armOK(c.armador)),ops=HIST.ops.filter(o=>inPer(o.t)&&armOK(o.armador)),ots=HIST.ots.filter(o=>inPer(o.agenda));
  const occ=HIST.occ.filter(o=>inPer(o.t));
  const ov=ops.filter(o=>o.tipo==='Ovação'),ds=ops.filter(o=>o.tipo==='Desova');
  const K={
    draft:pct(bks.filter(b=>b.draftAt<=b.dd).length,bks.length),
    vgm:pct(bks.filter(b=>!b.vgmLate).length,bks.length),
    carga:pct(cnts.filter(c=>!c.late).length,cnts.length),
    rolados:cnts.filter(c=>c.rolado).length,
    otif:pct(ots.filter(o=>o.onTime&&o.inFull).length,ots.length),
    tat:avg(ots.map(o=>o.tat)),
    ovDur:avg(ov.map(o=>o.dur)),
    ovDia:ov.length/rep.per,
    dwell:avg(cnts.map(c=>c.dwell)),
    dwell72:pct(cnts.filter(c=>c.dwell>72).length,cnts.length),
    occ:avg(occ.map(o=>o.p)),
